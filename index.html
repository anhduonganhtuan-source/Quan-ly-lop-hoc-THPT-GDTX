      // ============================================================================
      // THAO TÁC CẬP NHẬT DỮ LIỆU
      // ============================================================================
      const handleUpdateStudentFieldInline = (stuId, field, value) => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) =>
            s.id === stuId ? { ...s, [field]: value } : s
          ),
        }));
      };

      const handleSaveStudentModal = (e) => {
        e.preventDefault();
        if (!studentModal || !studentModal.name.trim()) return;
        const generatedInternalId = studentModal.id?.trim() || `HS${Date.now().toString().slice(-4)}`;
        const hasVoc =
          typeof studentModal.hasVocational === 'boolean'
            ? studentModal.hasVocational
            : studentModal.vocational !== 'Không học nghề';
        const stuData = {
          ...studentModal,
          id: generatedInternalId,
          moetId: (studentModal.moetId ?? '').trim(),
          name: studentModal.name.trim(),
          dob: (studentModal.dob || '').trim(),
          gender: studentModal.gender || 'Nam',
          status: studentModal.status || 'Đang học',
          hasVocational: hasVoc,
          vocational: hasVoc ? (studentModal.vocational || 'Chưa phân nghề') : 'Không học nghề',
          tuitionExemption: hasVoc ? (studentModal.tuitionExemption || 'Không thuộc diện') : 'Không thuộc diện',
          tuitionDocStatus: hasVoc ? (studentModal.tuitionDocStatus || 'Chưa nộp') : 'Chỉ học Văn hóa',
          role: studentModal.role || 'Thành viên',
          attitude: studentModal.attitude || 'Tích cực',
          team: Number(studentModal.team) || 1,
          seat: Number(studentModal.seat) || currentStudents.length + 1,
          deskSlot: studentModal.deskSlot || '',
          studentPhone: (studentModal.studentPhone || '').trim(),
          parentPhone: (studentModal.parentPhone || '').trim(),
          cccdNumber: (studentModal.cccdNumber || '').trim(),
          cccdDate: (studentModal.cccdDate || '').trim(),
          bankAccount: (studentModal.bankAccount || '').trim(),
          bankName: (studentModal.bankName || 'BIDV Tây Ninh - PGD Gò Dầu').trim(),
          addressWard: (studentModal.addressWard || '').trim(),
          specialNote: (studentModal.specialNote || '').trim(),
          gvcnComment: studentModal.gvcnComment || '',
        };

        if (studentModal.mode === 'ADD') {
          setStudentsByClass((prev) => ({
            ...prev,
            [activeClass]: [...(prev[activeClass] || []), stuData],
          }));
          showToast(`Đã thêm học sinh ${stuData.name} và tự động lưu.`);
        } else {
          setStudentsByClass((prev) => ({
            ...prev,
            [activeClass]: (prev[activeClass] || []).map((s) =>
              s.id === studentModal.originalId ? stuData : s
            ),
          }));
          showToast(`Đã cập nhật hồ sơ học sinh ${stuData.name}.`);
        }
        setStudentModal(null);
      };

      const handleDeleteStudent = (stuId) => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).filter((s) => s.id !== stuId),
        }));
        showToast('Đã xóa học sinh khỏi danh sách lớp.');
      };

      const handleAddClass = (e) => {
        e.preventDefault();
        const raw = newClassName.trim();
        if (!raw) return;
        const id = raw.replace(/\s+/g, '').toUpperCase();
        if (classes.some((c) => c.id === id)) {
          showToast('Mã lớp này đã tồn tại!');
          return;
        }
        setClasses((prev) => [...prev, { id, name: raw.startsWith('Lớp') ? raw : `Lớp ${raw}` }]);
        setStudentsByClass((prev) => ({ ...prev, [id]: [] }));
        setClassSubjects((prev) => ({
          ...prev,
          [id]: [mainSubject, 'Toán', 'Ngữ văn', 'Tiếng Anh'],
        }));
        setActiveClass(id);
        setNewClassName('');
        setNewClassModalOpen(false);
        showToast(`Đã tạo lớp mới: ${raw}`);
      };

      const handleDeleteClass = (classId) => {
        if (classes.length <= 1) {
          showToast('Cần giữ lại ít nhất 1 lớp học trong hệ thống.');
          return;
        }
        const nextClasses = classes.filter((c) => c.id !== classId);
        setClasses(nextClasses);
        if (activeClass === classId) setActiveClass(nextClasses[0].id);
        showToast(`Đã xóa lớp ${classId}.`);
      };

      const handleAddSubjectToClass = (e) => {
        e.preventDefault();
        const name = newSubjectName.trim();
        if (!name || currentSubjects.includes(name)) return;
        setClassSubjects((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), name],
        }));
        setSelectedSubject(name);
        setNewSubjectName('');
        showToast(`Đã thêm môn ${name} cho ${currentClassObj.name}.`);
      };

      const handleRemoveSubjectFromClass = (subjName) => {
        if (currentSubjects.length <= 1) return;
        const updated = currentSubjects.filter((s) => s !== subjName);
        setClassSubjects((prev) => ({ ...prev, [activeClass]: updated }));
        setSelectedSubject(updated[0]);
      };

      const handleGradeChange = (stuId, field, value) => {
        setGrades((prev) => {
          const classGrades = prev[activeClass] || {};
          const semGrades = classGrades[semester] || {};
          const subjGrades = semGrades[selectedSubject] || {};
          const stuGrades = subjGrades[stuId] || {
            tx1: '', tx2: '', tx3: '', tx4: '', gk: '', ck: '', comment: '',
          };
          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: {
                ...semGrades,
                [selectedSubject]: {
                  ...subjGrades,
                  [stuId]: { ...stuGrades, [field]: value },
                },
              },
            },
          };
        });
      };

      const toggleAttendanceCode = (stuId, dayKey, codeId, sessionKey = 'S', forceAddOnly = false) => {
        setAttendance((prev) => {
          const classAtt = prev[activeClass] || {};
          const weekAtt = classAtt[selectedWeek] || {};
          const stuAtt = { ...(weekAtt[stuId] || {}) };
          const sessionField = `${dayKey}_${sessionKey}`;

          let currentCodes = [];
          if (Array.isArray(stuAtt[sessionField])) {
            currentCodes = stuAtt[sessionField];
          } else if (sessionKey === 'S' && Array.isArray(stuAtt[dayKey])) {
            currentCodes = stuAtt[dayKey];
            delete stuAtt[dayKey];
          }

          const exists = currentCodes.includes(codeId);
          let nextCodes;
          if (forceAddOnly) {
            nextCodes = exists ? currentCodes : [...currentCodes, codeId];
          } else {
            nextCodes = exists
              ? currentCodes.filter((c) => c !== codeId)
              : [...currentCodes, codeId];
          }

          stuAtt[sessionField] = nextCodes;
          return {
            ...prev,
            [activeClass]: {
              ...classAtt,
              [selectedWeek]: {
                ...weekAtt,
                [stuId]: stuAtt,
              },
            },
          };
        });
      };

      const handleBatchTeamAttendance = () => {
        const teamMembers = currentStudents.filter((s) => (Number(s.team) || 1) === Number(batchTeam));
        if (teamMembers.length === 0) {
          showToast(`Tổ ${batchTeam} hiện chưa có học sinh.`);
          return;
        }
        teamMembers.forEach((stu) => {
          toggleAttendanceCode(stu.id, batchDayKey, batchCodeId, batchSessionKey, true);
        });
        const typeObj = attendanceTypes.find((t) => t.id === batchCodeId);
        showToast(
          `Đã áp dụng [${batchCodeId}] (${typeObj?.label || ''}) cho ${teamMembers.length} HS Tổ ${batchTeam} (${batchDayKey} - ${
            batchSessionKey === 'S' ? 'Sáng' : 'Chiều'
          })!`
        );
      };

      const handleApproveLeaveRequest = (reqId) => {
        const req = currentLeaveRequests.find((r) => r.id === reqId);
        if (!req) return;
        setLeaveRequestsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((r) =>
            r.id === reqId ? { ...r, status: 'APPROVED' } : r
          ),
        }));
        setAttendance((prev) => {
          const classAtt = prev[activeClass] || {};
          const weekAtt = classAtt[req.week] || {};
          const stuAtt = { ...(weekAtt[req.studentId] || {}) };
          const field = `${req.dayKey}_${req.sessionKey}`;
          const arr = Array.isArray(stuAtt[field]) ? [...stuAtt[field]] : [];
          if (!arr.includes('P')) arr.push('P');
          stuAtt[field] = arr;
          return {
            ...prev,
            [activeClass]: {
              ...classAtt,
              [req.week]: { ...weekAtt, [req.studentId]: stuAtt },
            },
          };
        });
        showToast('Đã duyệt đơn xin phép và tự động đồng bộ mã [P] vào Sổ Chuyên cần!');
      };

      const clearWeekAttendance = () => {
        setAttendance((prev) => ({
          ...prev,
          [activeClass]: { ...(prev[activeClass] || {}), [selectedWeek]: {} },
        }));
        showToast(`Đã đặt toàn bộ học sinh Tuần ${selectedWeek} về trạng thái Có mặt đủ (100đ).`);
      };

      const parsedExcelPreviewRows = useMemo(() => {
        const rawLines = excelPasteText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        if (rawLines.length === 0) return [];

        const firstLineLower = rawLines[0].toLowerCase();
        const isHeaderRow =
          firstLineLower.includes('họ và tên') ||
          firstLineLower.includes('họ tên') ||
          firstLineLower.includes('mã định danh') ||
          firstLineLower.includes('ngày sinh');
        const dataLines = isHeaderRow ? rawLines.slice(1) : rawLines;

        return dataLines.map((line, idx) => {
          const rawCols = line.includes('\t') ? line.split('\t') : line.split(',');
          let clean = rawCols.map((c) => c.replace(/^"|"$/g, '').replace(/^'/, '').trim());

          if (excelSkipSttCol && clean.length >= 2 && /^\d{1,3}$/.test(clean[0])) {
            clean = clean.slice(1);
          }

          if (excelImportMode === 'UPDATE_MOET_ID') {
            return {
              rowIndex: idx + 1,
              moetId: clean[0] ?? '',
              name: currentStudents[idx]?.name || `(Học sinh dòng ${idx + 1})`,
              dob: currentStudents[idx]?.dob || '',
              gender: currentStudents[idx]?.gender || 'Nam',
              status: clean[1] || currentStudents[idx]?.status || 'Đang học',
              vocational: clean[2] || currentStudents[idx]?.vocational || 'Tin học ứng dụng',
              studentPhone: currentStudents[idx]?.studentPhone || '',
              parentPhone: currentStudents[idx]?.parentPhone || '',
              role: currentStudents[idx]?.role || 'Thành viên',
            };
          }

          if (excelColumnLayout === 'NAME_FIRST') {
            const vocVal = clean[3] || 'Tin học ứng dụng';
            return {
              rowIndex: idx + 1,
              moetId: clean[6] || '',
              name: clean[0] || '',
              dob: clean[1] || '',
              gender: clean[2] || 'Nam',
              status: 'Đang học',
              vocational: vocVal,
              hasVocational: vocVal !== 'Không học nghề',
              studentPhone: clean[4] || '',
              parentPhone: clean[5] || '',
              role: 'Thành viên',
            };
          }

          const vocVal = clean[4] || 'Tin học ứng dụng';
          return {
            rowIndex: idx + 1,
            moetId: clean[0] || '',
            name: clean[1] || clean[0] || '',
            dob: clean[2] || '',
            gender: clean[3] || 'Nam',
            vocational: vocVal,
            hasVocational: vocVal !== 'Không học nghề',
            studentPhone: clean[5] || '',
            parentPhone: clean[6] || '',
            status: clean[7] || 'Đang học',
            role: clean[8] || 'Thành viên',
          };
        }).filter((r) => r.name || r.moetId);
      }, [excelPasteText, excelImportMode, excelColumnLayout, excelSkipSttCol, currentStudents]);

      const handleDownloadExcelTemplateCSV = () => {
        const headers = [
          'STT',
          'Mã định danh (Tự nhập)',
          'Họ và tên học sinh',
          'Ngày sinh (DD/MM/YYYY)',
          'Giới tính (Nam/Nữ)',
          'Đăng ký Học nghề (Hoặc ghi Không học nghề)',
          'SĐT Học sinh',
          'SĐT Phụ huynh',
          'Tình trạng',
          'Chức vụ',
        ];
        const sampleRows = [
          ['1', `'072209001234`, '"Nguyễn Hoàng Phương Thảo"', '22/04/2011', 'Nữ', '"Tin học ứng dụng"', `'0912345678`, `'0987654321`, '"Đang học"', '"Lớp trưởng"'],
          ['2', `'072209001235`, '"Trần Minh Khôi"', '15/08/2011', 'Nam', '"Điện công nghiệp"', `'0912345679`, `'0987654322`, '"Đang học"', '"Thành viên"'],
          ['3', `''`, '"Lê Ngọc Bảo Trân"', '03/11/2011', 'Nữ', '"Không học nghề"', `'0912345680`, `'0987654323`, '"Đang học"', '"Thành viên"'],
        ];
        const csvContent = '\uFEFF' + [headers.join(','), ...sampleRows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `File_Mau_Nhap_Hoc_Sinh_Chuan_${activeClass}.csv`;
        a.click();
        showToast('Đã tải File Mẫu Excel (.CSV) có sẵn tiêu đề cột!');
      };

      const handleUploadExcelStudentCSVFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          setExcelPasteText(evt.target.result || '');
          showToast('Đã nạp dữ liệu từ file! Vui lòng kiểm tra Bảng Xem Trước bên dưới trước khi bấm Xác nhận.');
        };
        reader.readAsText(file);
      };

      const handleProcessExcelPaste = () => {
        if (parsedExcelPreviewRows.length === 0) {
          showToast('Chưa có dữ liệu hợp lệ. Vui lòng dán dữ liệu từ Excel hoặc chọn file .CSV!');
          return;
        }

        if (excelImportMode === 'UPDATE_MOET_ID') {
          setStudentsByClass((prev) => {
            const list = [...(prev[activeClass] || [])];
            parsedExcelPreviewRows.forEach((row, idx) => {
              if (list[idx]) {
                list[idx] = {
                  ...list[idx],
                  moetId: row.moetId !== '' ? row.moetId : (list[idx].moetId || ''),
                  status: row.status || list[idx].status || 'Đang học',
                  vocational: row.vocational || list[idx].vocational || 'Chưa phân nghề',
                };
              }
            });
            return { ...prev, [activeClass]: list };
          });
          setExcelPasteText('');
          setExcelImportModalOpen(false);
          showToast('Đã cập nhật Mã định danh / Tình trạng / Học nghề theo đúng dữ liệu Thầy/Cô nhập!');
          return;
        }

        const baseCount = excelImportMode === 'REPLACE_STUDENTS' ? 0 : currentStudents.length;
        const added = parsedExcelPreviewRows.map((row, idx) => ({
          id: `HS_${Date.now()}_${idx}`,
          moetId: (row.moetId || '').trim(),
          name: (row.name || '').trim() || `Học sinh ${baseCount + idx + 1}`,
          dob: (row.dob || '').trim(),
          gender: row.gender || 'Nam',
          status: row.status || 'Đang học',
          hasVocational: row.hasVocational,
          vocational: row.vocational || 'Tin học ứng dụng',
          tuitionExemption: row.hasVocational ? 'Miễn 100% học phí nghề (NĐ 81)' : 'Không thuộc diện',
          tuitionDocStatus: row.hasVocational ? 'Chưa nộp' : 'Chỉ học Văn hóa',
          role: row.role || 'Thành viên',
          attitude: 'Tích cực',
          team: ((baseCount + idx) % 4) + 1,
          seat: baseCount + idx + 1,
          deskSlot: '',
          studentPhone: (row.studentPhone || '').trim(),
          parentPhone: (row.parentPhone || '').trim(),
          cccdNumber: '',
          cccdDate: '',
          bankAccount: '',
          bankName: 'BIDV Tây Ninh - PGD Gò Dầu',
          addressWard: '',
          specialNote: '',
          gvcnComment: '',
        }));

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]:
            excelImportMode === 'REPLACE_STUDENTS'
              ? added.map((stu, i) => ({ ...stu, team: (i % 4) + 1, seat: i + 1 }))
              : [...(prev[activeClass] || []), ...added],
        }));
        setExcelPasteText('');
        setExcelImportModalOpen(false);
        showToast(
          excelImportMode === 'REPLACE_STUDENTS'
            ? `Đã thay mới danh sách lớp ${currentClassObj.name} gồm ${added.length} học sinh!`
            : `Đã thêm ${added.length} học sinh vào ${currentClassObj.name}!`
        );
      };

      const handleProcessGradePaste = () => {
        const lines = gradePasteText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        setGrades((prev) => {
          const classGrades = { ...(prev[activeClass] || {}) };
          const semGrades = { ...(classGrades[semester] || {}) };
          const subjGrades = { ...(semGrades[selectedSubject] || {}) };

          currentStudents.forEach((stu, idx) => {
            if (!lines[idx]) return;
            const cols = lines[idx].includes('\t') ? lines[idx].split('\t') : lines[idx].split(',');
            const clean = cols.map((c) => c.trim());
            const existing = subjGrades[stu.id] || {};
            subjGrades[stu.id] = {
              ...existing,
              tx1: clean[0] ?? existing.tx1 ?? '',
              tx2: clean[1] ?? existing.tx2 ?? '',
              tx3: clean[2] ?? existing.tx3 ?? '',
              tx4: clean[3] ?? existing.tx4 ?? '',
              gk: clean[4] ?? existing.gk ?? '',
              ck: clean[5] ?? existing.ck ?? '',
              comment: clean[6] ?? existing.comment ?? '',
            };
          });

          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: { ...semGrades, [selectedSubject]: subjGrades },
            },
          };
        });

        setGradePasteText('');
        setGradePasteModalOpen(false);
        showToast(`Đã dán điểm môn ${selectedSubject} (${semester}).`);
      };

      const handleAssignStudentToSeatSlot = (slotKey, colNum, targetStudentId) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (!targetStudentId) return s.deskSlot === slotKey ? { ...s, deskSlot: '' } : s;
            if (s.id === targetStudentId) return { ...s, deskSlot: slotKey, team: getTeamNumberForColumn(colNum, seatLayoutConfig.cols, activeTeamCount) };
            if (s.deskSlot === slotKey) return { ...s, deskSlot: '' };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
      };

      const handleSwapTwoDeskSlots = (slotA, colA, slotB, colB) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (s.deskSlot === slotA) return { ...s, deskSlot: slotB, team: colB };
            if (s.deskSlot === slotB) return { ...s, deskSlot: slotA, team: colA };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
        showToast(`Đã đổi chỗ ngồi giữa vị trí ${slotA} và ${slotB}!`);
      };

      const getTeamNumberForColumn = (colNum, totalCols, tCount) => {
        const tc = Math.max(2, Math.min(8, Number(tCount) || 4));
        if (tc === totalCols) return colNum;
        return ((colNum - 1) % tc) + 1;
      };

      const handleChangeTeamCount = (nextTeamCount) => {
        const tc = Math.max(2, Math.min(8, Number(nextTeamCount) || 4));
        setSeatLayoutConfig((prev) => ({ ...prev, teamCount: tc }));
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((stu, idx) => {
            const curTeam = Number(stu.team) || 1;
            const normalizedTeam = curTeam > tc ? (idx % tc) + 1 : curTeam;
            return { ...stu, team: normalizedTeam };
          });
          return { ...prev, [activeClass]: list };
        });
        showToast(`Đã cập nhật lớp ${currentClassObj.name} thành ${tc} tổ!`);
      };

      const handleAutoArrangeDesks = () => {
        const { cols, desksPerCol, seatsPerDesk } = seatLayoutConfig;
        const tc = activeTeamCount;
        const slots = [];
        for (let r = 1; r <= desksPerCol; r++) {
          for (let c = 1; c <= cols; c++) {
            for (let s = 1; s <= seatsPerDesk; s++) {
              slots.push({ slotKey: `${c}-${r}-${s}`, col: c });
            }
          }
        }
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((stu, idx) => {
            const target = slots[idx];
            const assignedTeam = tc === cols && target ? target.col : (idx % tc) + 1;
            return target
              ? { ...stu, deskSlot: target.slotKey, team: assignedTeam }
              : { ...stu, deskSlot: '', team: assignedTeam };
          });
          return { ...prev, [activeClass]: list };
        });
        showToast(`Đã xếp tuần tự toàn bộ học sinh vào các bàn học và chia đều theo ${tc} tổ!`);
      };

      const getStudentAttendanceMetricForSeating = (stuId, scope = attendanceSeatScope) => {
        if (scope === 'WEEK') {
          const w = calculateWeeklyConductScore(stuId, selectedWeek);
          return {
            score: w.score,
            absentTotal: w.totalAbsentK + w.totalAbsentP,
            absentK: w.totalAbsentK,
            late: w.totalLate,
            violations: w.totalViolations,
            label: `T${selectedWeek}: ${w.score}đ`,
          };
        }
        if (scope === 'YEAR') {
          const y = calculateYearAttendanceSummary(stuId);
          return {
            score: y.avgConductScore,
            absentTotal: y.absentK + y.absentP,
            absentK: y.absentK,
            late: y.late,
            violations: y.totalViolations,
            label: `Năm: ${y.avgConductScore}đ`,
          };
        }
        const m = calculateMonthlyConductSummary(stuId, selectedReportMonth);
        return {
          score: m.avgScore,
          absentTotal: m.totalAbsent,
          absentK: m.absentK,
          late: m.lateM,
          violations: m.violationCount,
          label: `Th${selectedReportMonth}: ${m.avgScore}đ`,
        };
      };

      // SẮP XẾP CHỖ NGỒI TỰ ĐỘNG THEO CHUYÊN CẦN & CHIA ĐỀU THEO SỐ TỔ ĐÃ CHỌN
      const handleAutoArrangeByAttendance = (
        customScope = attendanceSeatScope,
        customStrategy = attendanceSeatStrategy
      ) => {
        if (currentStudents.length === 0) return;
        const { cols, desksPerCol, seatsPerDesk } = seatLayoutConfig;
        const tc = activeTeamCount;

        const slots = [];
        for (let r = 1; r <= desksPerCol; r++) {
          for (let c = 1; c <= cols; c++) {
            for (let s = 1; s <= seatsPerDesk; s++) {
              slots.push({ slotKey: `${c}-${r}-${s}`, col: c, row: r, seat: s });
            }
          }
        }

        const withMetrics = currentStudents.map((stu) => ({
          stu,
          m: getStudentAttendanceMetricForSeating(stu.id, customScope),
        }));

        // Sắp xếp từ chuyên cần kém nhất (nhiều vắng KP / điểm thấp) -> tốt nhất
        const worstFirst = [...withMetrics].sort(
          (a, b) =>
            b.m.absentK - a.m.absentK ||
            b.m.absentTotal - a.m.absentTotal ||
            a.m.score - b.m.score ||
            b.m.violations - a.m.violations
        );

        let ordered = [];
        if (customStrategy === 'AT_RISK_FRONT') {
          ordered = worstFirst;
        } else if (customStrategy === 'GOOD_FRONT') {
          ordered = [...worstFirst].reverse();
        } else {
          // INTERLEAVE_BUDDY: Xen kẽ 1 HS chuyên cần xuất sắc ngồi cạnh 1 HS cần nhắc nhở chuyên cần
          const bestFirst = [...worstFirst].reverse();
          const usedIds = new Set();
          let lo = 0;
          let hi = 0;
          while (ordered.length < withMetrics.length) {
            while (hi < bestFirst.length && usedIds.has(bestFirst[hi].stu.id)) hi++;
            if (hi < bestFirst.length) {
              ordered.push(bestFirst[hi]);
              usedIds.add(bestFirst[hi].stu.id);
              hi++;
            }
            while (lo < worstFirst.length && usedIds.has(worstFirst[lo].stu.id)) lo++;
            if (lo < worstFirst.length) {
              ordered.push(worstFirst[lo]);
              usedIds.add(worstFirst[lo].stu.id);
              lo++;
            }
          }
        }

        const assignMap = {};
        ordered.forEach((item, idx) => {
          const target = slots[idx];
          // Phân tổ đều từ 1 -> activeTeamCount (nếu số tổ = số dãy thì khớp luôn theo dãy)
          const assignedTeam = target
            ? tc === cols
              ? target.col
              : Math.floor((idx * tc) / Math.max(1, ordered.length)) + 1
            : (idx % tc) + 1;
          assignMap[item.stu.id] = {
            deskSlot: target ? target.slotKey : '',
            team: Math.min(tc, Math.max(1, assignedTeam)),
          };
        });

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) =>
            assignMap[s.id]
              ? { ...s, deskSlot: assignMap[s.id].deskSlot, team: assignMap[s.id].team }
              : s
          ),
        }));

        const scopeLabel =
          customScope === 'WEEK'
            ? `Tuần ${selectedWeek}`
            : customScope === 'YEAR'
            ? 'Cả năm học'
            : `Tháng ${selectedReportMonth}`;
        const stratLabel =
          customStrategy === 'AT_RISK_FRONT'
            ? 'HS hay vắng/điểm RL thấp ngồi bàn đầu để GV sát sao'
            : customStrategy === 'GOOD_FRONT'
            ? 'HS chuyên cần tốt nhất ngồi bàn đầu'
            : 'Xen kẽ 1 HS chuyên cần tốt kèm 1 HS cần nhắc nhở ngồi cạnh nhau';
        showToast(`Đã xếp chỗ ngồi theo chuyên cần (${scopeLabel}: ${stratLabel}) và chia đều ${tc} tổ!`);
      };

      const handleClearAllDesks = () => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) => ({ ...s, deskSlot: '' })),
        }));
        showToast('Đã làm trống sơ đồ bàn học.');
      };

      const buildSmartPedagogicalComment = (stu, tone = aiTone, targetMode = aiTargetMode) => {
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa =
          targetMode === 'GVCN_YEAR'
            ? getStudentOverallGPA(stu.id, summaryPeriodMode)
            : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester));

        const rolePart =
          stu.role && stu.role !== 'Thành viên'
            ? `Trên cương vị ${stu.role}, em luôn gương mẫu và trách nhiệm với tập thể. `
            : '';
        const vocPart =
          stu.vocational && stu.vocational !== 'Chưa phân nghề' && stu.vocational !== 'Không học nghề'
            ? `Định hướng nghề ${stu.vocational} nghiêm túc. `
            : '';

        let attitudePart =
          stu.attitude === 'Rất tích cực' || stu.attitude === 'Tích cực'
            ? 'Trong giờ học, em có thái độ học tập sôi nổi, hăng hái phát biểu xây dựng bài'
            : stu.attitude === 'Chăm chỉ' || stu.attitude === 'Khá chú ý'
            ? 'Em có ý thức học tập nghiêm túc, ghi chép bài đầy đủ và lắng nghe giảng bài'
            : 'Em cần tập trung chú ý hơn trên lớp và chủ động hoàn thành bài tập về nhà';

        const conductPart =
          yearCond.absentK === 0 && yearCond.late === 0
            ? `, chuyên cần đạt ${yearCond.avgConductScore}đ (${yearCond.yearConductRank}, đi học đúng giờ, đầy đủ). `
            : `, điểm chuyên cần đạt ${yearCond.avgConductScore}đ (vắng ${yearCond.absentP}P/${yearCond.absentK}K, đi muộn ${yearCond.late} lần - cần khắc phục để chuyên cần hơn). `;

        let scorePart = 'Đang cập nhật tiến độ điểm đánh giá định kỳ.';
        if (gpa !== null) {
          if (gpa >= 8.0) scorePart = `Kết quả học tập đạt mức Tốt (ĐTB ${gpa}), nắm vững kiến thức trọng tâm.`;
          else if (gpa >= 6.5) scorePart = `Kết quả học tập đạt mức Khá (ĐTB ${gpa}), nắm được kiến thức cơ bản.`;
          else if (gpa >= 5.0) scorePart = `Kết quả học tập đạt mức Đạt (ĐTB ${gpa}), cần rèn thêm kỹ năng giải bài tập.`;
          else scorePart = `Kết quả học tập hiện ở mức ${gpa}, gia đình và nhà trường cần phối hợp hỗ trợ em củng cố kiến thức.`;
        }

        if (tone === 'FORMAL_TT22') return `${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart}`;
        if (tone === 'DETAILED_PARENT') {
          return `Kính gửi Phụ huynh em ${stu.name}: ${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart} Rất mong gia đình tiếp tục đồng hành cùng nhà trường.`;
        }
        return `${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart} Chúc em luôn giữ vững sự tự tin và tiến bộ!`;
      };

      const handleGenerateAICommentsForAll = () => {
        setAiGenerating(true);
        setTimeout(() => {
          if (aiTargetMode === 'GVCN_YEAR') {
            setStudentsByClass((prev) => ({
              ...prev,
              [activeClass]: (prev[activeClass] || []).map((stu) => ({
                ...stu,
                gvcnComment: buildSmartPedagogicalComment(stu, aiTone, 'GVCN_YEAR'),
              })),
            }));
          } else {
            currentStudents.forEach((stu) => {
              const cmt = buildSmartPedagogicalComment(stu, aiTone, 'SUBJECT_COMMENT');
              handleGradeChange(stu.id, 'comment', cmt);
            });
          }
          setAiGenerating(false);
          setAiModalOpen(false);
          showToast(`Đã tạo nhận xét AI cho toàn bộ ${currentStudents.length} học sinh!`);
        }, 250);
      };

      const exportClassCSV = () => {
        const headers = [
          'Mã định danh', 'Họ và tên', 'Ngày sinh', 'Giới tính', 'Tình trạng', 'Học nghề',
          'Chế độ miễn giảm HP', 'Hồ sơ HP', 'Chức vụ', 'Thái độ học tập', 'Tổ',
          'SĐT Học sinh', 'SĐT Phụ huynh', 'Lưu ý đặc biệt',
          `Điểm Chuyên cần Tuần ${selectedWeek}`,
          `Điểm Chuyên cần Tháng ${selectedReportMonth}`,
          ...currentSubjects.map((s) => `ĐTB ${s} (${semester})`),
          'ĐTB Chung', 'Nhận xét GVCN',
        ];
        const rows = currentStudents.map((stu) => {
          const cond = calculateWeeklyConductScore(stu.id);
          const mCond = calculateMonthlyConductSummary(stu.id, selectedReportMonth);
          const subjScores = currentSubjects.map((subj) => {
            const avg = calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? avg : '';
          });
          const gpa = getStudentOverallGPA(stu.id, 'SEMESTER') ?? '';
          return [
            `'${stu.moetId || ''}`, `"${stu.name}"`, stu.dob, stu.gender,
            `"${stu.status || 'Đang học'}"`, `"${stu.vocational || 'Chưa phân nghề'}"`,
            `"${stu.tuitionExemption || ''}"`, `"${stu.tuitionDocStatus || ''}"`,
            `"${stu.role}"`, `"${stu.attitude}"`, stu.team,
            `'${stu.studentPhone}`, `'${stu.parentPhone}`,
            `"${(stu.specialNote || '').replace(/"/g, '""')}"`,
            cond.score, mCond.avgScore, ...subjScores, gpa,
            `"${(stu.gvcnComment || '').replace(/"/g, '""')}"`,
          ].join(',');
        });
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SoQuanLyLop_${activeClass}_${schoolYear.replace(/\s+/g, '')}.csv`;
        a.click();
        showToast(`Đã xuất file Excel/CSV lớp ${activeClass}!`);
      };

            // PHÂN TÍCH & NHẮC NHỞ ĐỐI TƯỢNG HỌC SINH ĐIỂM THẤP TRONG TUẦN (ĐIỂM RÈN LUYỆN THẤP + ĐIỂM HỌC TẬP THẤP + LỖI TƯƠNG ĐƯƠNG NGHỈ KP/CP NHIỀU LẦN)
      const getStudentLowScoreReminder = useCallback((stu, weekNum = selectedWeek) => {
        const wCond = calculateWeeklyConductScore(stu.id, weekNum);
        const mCond = calculateMonthlyConductSummary(stu.id, selectedReportMonth);
        const yCond = calculateYearAttendanceSummary(stu.id);
        const gpaSem = getStudentOverallGPA(stu.id, 'SEMESTER');

        const lowAcademicSubjects = [];
        currentSubjects.forEach((subj) => {
          const scObj = getStudentSubjectScoreObj(stu.id, subj, semester);
          const avg = calculateSubjectAverage(scObj);
          const lowCols = ['tx1', 'tx2', 'tx3', 'tx4', 'gk', 'ck']
            .filter((k) => scObj[k] !== '' && scObj[k] !== undefined && !isNaN(parseFloat(scObj[k])) && parseFloat(scObj[k]) < 6.0)
            .map((k) => `${k.toUpperCase()}: ${scObj[k]}đ`);
          if ((avg !== null && avg < 6.5) || lowCols.length > 0) {
            lowAcademicSubjects.push({
              subject: subj,
              avg,
              lowCols,
              summary: `${subj} (ĐTB: ${avg ?? '--'}${lowCols.length ? ' • Cột thấp: ' + lowCols.join(', ') : ''})`,
            });
          }
        });

        const isLowConductWeek = wCond.score < 95 || wCond.totalAbsentK > 0 || wCond.totalAbsentP >= 2 || wCond.repeatMinorCount >= 2;
        const isLowAcademic = lowAcademicSubjects.length > 0 || (gpaSem !== null && gpaSem < 6.5);
        const needsWeeklyReminder = isLowConductWeek || isLowAcademic;

        // Nhãn lỗi tương đương nghỉ có phép / không phép nhiều lần (tính cả tuần & tháng)
        const equivLabels = [...(wCond.equivWarningLabels || [])];
        if ((mCond.skipClassCT || 0) > 0 && !equivLabels.some((x) => x.includes('Cúp tiết'))) {
          equivLabels.push(`🚨 Cúp tiết Tháng ${selectedReportMonth}: ${mCond.skipClassCT} lần (Đã cộng vào lũy kế Nghỉ KP)`);
        }
        if (mCond.absentK >= 2 && !equivLabels.some((x) => x.includes('Nghỉ không phép nhiều lần'))) {
          equivLabels.push(`🚨 Lũy kế Nghỉ KP + Cúp tiết Tháng ${selectedReportMonth}: ${mCond.absentK} buổi`);
        }
        if (mCond.absentP >= 2 && !equivLabels.some((x) => x.includes('Nghỉ có phép nhiều lần'))) {
          equivLabels.push(`⚠️ Nghỉ có phép nhiều lần trong Tháng ${selectedReportMonth}: ${mCond.absentP} buổi`);
        }
        if ((mCond.repeatMinorCount || 0) >= 3 && !equivLabels.some((x) => x.includes('lặp lại'))) {
          equivLabels.push(`⚠️ Vi phạm lặp lại nhiều lần (${mCond.repeatMinorCount} lượt ≈ ${mCond.convertedAbsentFromRepeats} buổi nghỉ quy đổi)`);
        }

        const reminderReasons = [];
        if (wCond.score < 95) {
          reminderReasons.push(`Điểm rèn luyện Tuần ${weekNum} thấp (${wCond.score}/100đ - ${wCond.rank})`);
        }
        if (wCond.skipClassCT > 0) {
          reminderReasons.push(`Vi phạm Cúp tiết nghiêm trọng (${wCond.skipClassCT} lần → Tính = ${wCond.skipClassCT} buổi Nghỉ KP lũy kế)`);
        }
        if (wCond.rawAbsentK > 0) {
          reminderReasons.push(`Nghỉ học không phép (${wCond.rawAbsentK} buổi)`);
        }
        if (wCond.totalAbsentP >= 2) {
          reminderReasons.push(`Nghỉ có phép nhiều lần (${wCond.totalAbsentP} buổi/tuần)`);
        }
        if (wCond.repeatMinorCount >= 2) {
          reminderReasons.push(`Tái phạm lỗi nội quy/đi muộn nhiều lần (${wCond.repeatMinorCount} lượt ≈ ${wCond.convertedAbsentFromRepeats} buổi nghỉ)`);
        }
        if (lowAcademicSubjects.length > 0) {
          reminderReasons.push(`Điểm học tập thấp cần củng cố: ${lowAcademicSubjects.map((x) => x.summary).join('; ')}`);
        }

        let reminderAdvice = '';
        if (needsWeeklyReminder) {
          const parts = [];
          parts.push(`NHẮC NHỞ ĐỐI TƯỢNG ĐIỂM THẤP / VI PHẠM TUẦN ${weekNum}: Em ${stu.name} (NS: ${stu.dob || '—'}, Nghề: ${stu.vocational || 'Chỉ học Văn hóa'}) hiện có: ${reminderReasons.join(' | ')}.`);
          if (wCond.skipClassCT > 0 || wCond.rawAbsentK > 0) {
            parts.push(`Lưu ý lỗi Cúp tiết [CT] được tính nghiêm trọng tương đương Nghỉ không phép [K] vào tổng lũy kế (${yCond.absentK + yCond.absentP}/45 buổi năm học).`);
          }
          if (lowAcademicSubjects.length > 0) {
            parts.push(`Đề nghị em ôn tập ngay các môn điểm thấp (${lowAcademicSubjects.map((x) => x.subject).join(', ')}), hoàn thành bài tập về nhà và trao đổi với bạn kèm cặp trên lớp.`);
          } else {
            parts.push('Đề nghị Gia đình phối hợp nhắc nhở em đi học đúng giờ, không cúp tiết hoặc nghỉ học tự do.');
          }
          reminderAdvice = parts.join(' ');
        } else {
          reminderAdvice = `BIỂU DƯƠNG TUẦN ${weekNum}: Em ${stu.name} (NS: ${stu.dob || '—'}, Nghề: ${stu.vocational || 'Chỉ học Văn hóa'}) đi học chuyên cần đầy đủ 100% các buổi, không có vi phạm nội quy, điểm rèn luyện đạt ${wCond.score}/100đ (${wCond.rank}) và duy trì kết quả học tập tốt (ĐTB: ${gpaSem ?? '--'}). Đề nghị gia đình tiếp tục khen ngợi, khích lệ em phát huy!`;
        }

        return {
          wCond,
          mCond,
          yCond,
          gpaSem,
          lowAcademicSubjects,
          isLowConductWeek,
          isLowAcademic,
          needsWeeklyReminder,
          equivLabels,
          reminderReasons,
          reminderAdvice,
        };
      }, [selectedWeek, selectedReportMonth, currentSubjects, grades, activeClass, semester, attendance, attendanceTypes]);

      // TẠO BẢNG CHI TIẾT 7 NGÀY TRONG TUẦN (CN -> T7) GHI RÕ LỖI CỤ THỂ & NHẬN XÉT TỪNG NGÀY CHO PHIẾU IN TUẦN
      const buildWeeklyDayRowsForStudent = useCallback((stu, weekNum = selectedWeek) => {
        const wInfo = weekDatesMap[weekNum] || buildDefaultWeekDates(schoolYear)[weekNum] || {};
        const baseSun = new Date((wInfo.startSunday || formatISODate(getSundayOfDate(new Date()))) + 'T00:00:00');
        return DAYS_OF_WEEK.map((d) => {
          const dt = new Date(baseSun);
          dt.setDate(baseSun.getDate() + d.offset);
          const iso = formatISODate(dt);
          const vnDate = formatVNShortDate(iso);
          const fullVnDate = formatVNFullDate(iso);

          const sCodes = getStudentDaySessionCodes(stu.id, d.key, 'S', weekNum);
          const cCodes = getStudentDaySessionCodes(stu.id, d.key, 'C', weekNum);

          const mapCodesToItems = (codes, sessionLabel) =>
            codes.map((code) => {
              const t = attendanceTypes.find((x) => x.id === code) || { id: code, label: code, points: 0 };
              const ptsTxt = t.points > 0 ? `+${t.points}đ` : `${t.points}đ`;
              return {
                id: t.id,
                label: t.label,
                points: Number(t.points || 0),
                sessionLabel,
                formatted: `[${t.id}] ${t.label} (${ptsTxt})`,
              };
            });

          const morningItems = mapCodesToItems(sCodes, 'Sáng');
          const afternoonItems = mapCodesToItems(cCodes, 'Chiều');
          const allItems = [...morningItems, ...afternoonItems];

          const dayDelta = allItems.reduce((sum, item) => sum + item.points, 0);
          const negItems = allItems.filter((x) => x.points < 0);
          const posItems = allItems.filter((x) => x.points > 0);
          const hasSkipClass = allItems.some((x) => x.id === 'CT');
          const hasUnexcused = allItems.some((x) => x.id === 'K' || x.id === 'CT');
          const hasExcused = allItems.some((x) => x.id === 'P');

          let dayComment = 'Đi học đầy đủ, đúng giờ; chấp hành tốt nội quy lớp học.';
          if (negItems.length > 0 && posItems.length > 0) {
            dayComment = `Vi phạm: ${negItems.map((x) => `${x.label} (${x.sessionLabel})`).join(', ')}; có cố gắng: ${posItems.map((x) => x.label).join(', ')}.`;
          } else if (hasSkipClass) {
            dayComment = '🚨 Cúp tiết / Bỏ tiết nghiêm trọng (Đã tính +1 buổi vào lũy kế Nghỉ KP) — Cần thông báo Phụ huynh chấn chỉnh ngay.';
          } else if (hasUnexcused) {
            const otherNeg = negItems.filter((x) => x.id !== 'K').map((x) => `${x.label} (${x.sessionLabel})`);
            dayComment = `Nghỉ học không phép${otherNeg.length ? ' & ' + otherNeg.join(', ') : ''} — Cần Phụ huynh xác nhận lý do & chấn chỉnh ngay.`;
          } else if (negItems.some((x) => x.id !== 'P')) {
            const detailNeg = negItems.map((x) => `${x.label} (Buổi ${x.sessionLabel})`).join('; ');
            dayComment = `Lỗi cụ thể: ${detailNeg} — Nhắc học sinh nghiêm túc khắc phục.`;
          } else if (hasExcused) {
            dayComment = 'Nghỉ học có phép của gia đình — Nhắc em mượn vở chép bài và làm bài tập đầy đủ.';
          } else if (posItems.length > 0) {
            dayComment = `Biểu dương: ${posItems.map((x) => `${x.label} (Buổi ${x.sessionLabel})`).join(', ')}.`;
          }

          const specificErrorSummary =
            negItems.length === 0
              ? 'Không vi phạm (Thực hiện tốt)'
              : negItems.map((x) => `${x.label} (${x.sessionLabel}: ${x.points}đ)`).join('; ');

          return {
            dayKey: d.key,
            dayLabel: d.label,
            vnDate,
            fullVnDate,
            morningItems,
            afternoonItems,
            morningText: morningItems.length === 0 ? '✓ Có mặt đầy đủ, đúng giờ' : morningItems.map((x) => x.formatted).join('; '),
            afternoonText: afternoonItems.length === 0 ? '✓ Có mặt đầy đủ, đúng giờ' : afternoonItems.map((x) => x.formatted).join('; '),
            specificErrorSummary,
            dayDelta,
            hasViolation: negItems.length > 0,
            hasPraise: posItems.length > 0,
            negItems,
            posItems,
            dayComment,
          };
        });
      }, [weekDatesMap, selectedWeek, schoolYear, attendance, activeClass, attendanceTypes]);

          });
          const remInfo = getStudentLowScoreReminder(stu, selectedWeek);
          const specificViolationsTxt =

          const equivTagsTxt = remInfo.equivLabels.length > 0 ? remInfo.equivLabels.join(' | ') : 'Bình thường';

          const autoWeeklyComment = stu.gvcnComment || remInfo.reminderAdvice;
          return [
            idx + 1,

            `"Tổ ${stu.team}"`,

            wCond.totalLate,
            Math.max(0, wCond.totalViolations - wCond.totalAbsentK - wCond.totalLate),
            wCond.totalPlus,
            wCond.score,
            `"${wCond.rank}"`,
            `"${equivTagsTxt.replace(/"/g, '""')}"`,
            `"${lowSubjTxt.replace(/"/g, '""')}"`,
            `"${specificViolationsTxt.replace(/"/g, '""')}"`,
            `"${autoWeeklyComment.replace(/"/g, '""')}"`,
          ].join(',');
        });

        const titleLines = [
          `"PHIẾU TỔNG HỢP CHUYÊN CẦN & VI PHẠM TUẦN ${selectedWeek} (${semester.toUpperCase()} - NĂM HỌC ${schoolYear})"`,
          `"Trường: ${schoolName}","Lớp: ${currentClassObj.name}","GVCN: ${teacherName}","Thời gian: Từ CN ${formatVNFullDate(currentWeekInfo?.startSunday)} đến T7 ${formatVNFullDate(currentWeekInfo?.endSaturday)}"`,
          '',
        ];

        const csvContent = '\uFEFF' + [...titleLines, headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Phieu_ViPham_ChuyenCan_Tuan${selectedWeek}_Lop${activeClass}.csv`;
        a.click();
        showToast(`Đã xuất file Excel (.CSV) Bảng Vi Phạm Tuần ${selectedWeek} (có đầy đủ Họ tên, Ngày sinh, Nghề đang học & từng ngày)!`);
      };

      // XUẤT FILE EXCEL (.CSV) BÁO CÁO VI PHẠM & CHUYÊN CẦN THÁNG

      const handlePickRandomStudent = () => {
        if (currentStudents.length === 0) return;
        let pool = currentStudents.filter((s) => !pickedHistoryIds.includes(s.id));
        if (pool.length === 0) {
          pool = [...currentStudents];
          setPickedHistoryIds([]);
        }
        if (prioritizePassive) {
          const weighted = [];
          pool.forEach((s) => {
            const w = s.attitude === 'Còn thụ động' || s.attitude === 'Cần nhắc nhở' ? 3 : 1;
            for (let i = 0; i < w; i++) weighted.push(s);
          });
          const chosen = weighted[Math.floor(Math.random() * weighted.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        } else {
          const chosen = pool[Math.floor(Math.random() * pool.length)];
