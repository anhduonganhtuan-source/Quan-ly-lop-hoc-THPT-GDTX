      if (!str || typeof str !== 'string') return fallbackH * 60 + fallbackM;
      const clean = str.trim().replace(/h/i, ':');
      const parts = clean.split(':').map((x) => parseInt(x.trim(), 10));
      if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return Math.max(0, Math.min(1439, parts[0] * 60 + parts[1]));
      }
      return fallbackH * 60 + fallbackM;
    };

      const m = String(normalized % 60).padStart(2, '0');
      return `${h}:${m}`;
    };

      const breakRangesMap = {};

      let curM = parseTimeHMToMinutes(cfg.morningStart, 7, 0);
      for (let p = 1; p <= 5; p++) {
        const pid = `S${p}`;
        const customDur = Number(cfg.customPeriodDurations?.[pid]);
        const dur = !isNaN(customDur) && customDur >= 5 ? customDur : durMorningDefault;
        const startM = curM;
        const endM = startM + dur;
        periodTimesMap[pid] = `${formatMinutesToHM(startM)} - ${formatMinutesToHM(endM)}`;

        if (p < 5) {
          const brkObj = cfg.breaks[pid] || { minutes: 5, isRecess: p === 2, label: `Nghỉ sau Tiết ${p}` };
          const rawBrkMin = Number(brkObj.minutes);
          const brkMin = !isNaN(rawBrkMin) && rawBrkMin >= 0 ? rawBrkMin : 5;
          const brkStart = endM;
          const brkEnd = endM + brkMin;
          breakRangesMap[pid] = {
            ...brkObj,
            afterPeriod: pid,
            session: 'Sáng',
            afterNum: p,
            minutes: brkMin,
            isRecess: Boolean(brkObj.isRecess || brkMin >= 10),
            startHM: formatMinutesToHM(brkStart),
            endHM: formatMinutesToHM(brkEnd),
            timeRange: `${formatMinutesToHM(brkStart)} - ${formatMinutesToHM(brkEnd)}`,
          };
          curM = brkEnd;
        }
      }

      let curA = parseTimeHMToMinutes(cfg.afternoonStart, 13, 30);
      for (let p = 1; p <= 5; p++) {
        const pid = `C${p}`;
        const customDur = Number(cfg.customPeriodDurations?.[pid]);
        const dur = !isNaN(customDur) && customDur >= 5 ? customDur : durAfternoonDefault;
        const startA = curA;
        const endA = startA + dur;
        periodTimesMap[pid] = `${formatMinutesToHM(startA)} - ${formatMinutesToHM(endA)}`;

        if (p < 5) {
          const brkObj = cfg.breaks[pid] || { minutes: 5, isRecess: p === 2, label: `Nghỉ sau Tiết ${p} chiều` };
          const rawBrkMin = Number(brkObj.minutes);
          const brkMin = !isNaN(rawBrkMin) && rawBrkMin >= 0 ? rawBrkMin : 5;
          const brkStart = endA;
          const brkEnd = endA + brkMin;
          breakRangesMap[pid] = {
            ...brkObj,
            afterPeriod: pid,
            session: 'Chiều',
            afterNum: p,
            minutes: brkMin,
            isRecess: Boolean(brkObj.isRecess || brkMin >= 10),
            startHM: formatMinutesToHM(brkStart),
            endHM: formatMinutesToHM(brkEnd),
            timeRange: `${formatMinutesToHM(brkStart)} - ${formatMinutesToHM(brkEnd)}`,
          };
          curA = brkEnd;

      return { periodTimesMap, breakRangesMap, normalizedConfig: cfg };

    // ============================================================================
    // HỆ THỐNG LƯU TRỮ ĐA TẦNG DUNG LƯỢNG LỚN (INDEXED-DB > 500MB/GB + CACHE API + LOCAL/SESSION STORAGE)
    // Chống mất dữ liệu tuyệt đối khi bấm F5, tải lại trang hoặc đóng trình duyệt
    // ============================================================================
    const STORAGE_KEY = 'gv_student_app_v9_week10_pro';
    const BACKUP_STORAGE_KEY = 'gv_student_app_v9_week10_pro_backup';
    const LEGACY_KEYS = [
      'gv_student_app_v9_week10_pro',
      'gv_student_app_v9_week10_pro_backup',
      'gv_student_app_v8_pedagogical_master',
      'gv_student_app_v6_master',
      'gv_student_app_v9',
      'gv_student_app_v8',
      'gv_student_management_state'
    ];
    const IDB_NAME = 'GV_StudentManagement_LargeDB_v5';
    const IDB_STORE = 'workspace_store';
    const IDB_RECORD_KEY = 'primary_state';
    const IDB_BACKUP_KEY = 'mirror_backup_state';
    const CACHE_STORAGE_NAME = 'gv_student_management_large_cache_v1';
    const CACHE_RECORD_URL = '/__gv_student_management_state_v9__.json';
    const WINDOW_NAME_PREFIX = '__GV_APP_STATE_V9__:';

    const isValidStatePayload = (obj) => {
      return Boolean(obj && typeof obj === 'object' && obj.archiveByYear && typeof obj.archiveByYear === 'object');
    };

    const loadSavedStateSync = () => {
      const candidates = [];
      for (const key of LEGACY_KEYS) {
        try {
          const raw = window.localStorage ? localStorage.getItem(key) : null;
          if (raw) {
            const parsed = JSON.parse(raw);
            if (isValidStatePayload(parsed)) candidates.push(parsed);
          }
        } catch (e) {}
      }
      for (const key of [STORAGE_KEY, BACKUP_STORAGE_KEY]) {
        try {
          const raw = window.sessionStorage ? sessionStorage.getItem(key) : null;
          if (raw) {
            const parsed = JSON.parse(raw);
            if (isValidStatePayload(parsed)) candidates.push(parsed);
          }
        } catch (e) {}
      }
      try {
        if (typeof window.name === 'string' && window.name.startsWith(WINDOW_NAME_PREFIX)) {
          const parsed = JSON.parse(window.name.slice(WINDOW_NAME_PREFIX.length));
          if (isValidStatePayload(parsed)) candidates.push(parsed);
        }
      } catch (e) {}

      if (candidates.length === 0) return null;
      candidates.sort((a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
      return candidates[0];
    };

    let cachedDbPromise = null;
    const openLargeDatabase = () => {
      if (cachedDbPromise) return cachedDbPromise;
      cachedDbPromise = new Promise((resolve) => {
        if (typeof window === 'undefined' || !window.indexedDB) return resolve(null);
        try {
          const request = window.indexedDB.open(IDB_NAME, 1);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          request.onsuccess = () => {
            const db = request.result;
            db.onclose = () => { cachedDbPromise = null; };
            resolve(db);
          };
          request.onerror = () => {
            cachedDbPromise = null;
            resolve(null);
          };
          request.onblocked = () => {
            cachedDbPromise = null;
            resolve(null);
          };
        } catch (e) {
          cachedDbPromise = null;
          resolve(null);
        }
      });
      return cachedDbPromise;
    };

    const saveToLargeIndexedDB = async (payload) => {
      try {
        const db = await openLargeDatabase();
        if (!db) return false;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          store.put(payload, IDB_RECORD_KEY);
          store.put(payload, IDB_BACKUP_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
          tx.onabort = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    };

    const loadFromLargeIndexedDB = async () => {
      try {
        const db = await openLargeDatabase();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const reqPrimary = store.get(IDB_RECORD_KEY);
          const reqBackup = store.get(IDB_BACKUP_KEY);
          let primaryVal = null;
          let backupVal = null;
          reqPrimary.onsuccess = () => { primaryVal = reqPrimary.result || null; };
          reqBackup.onsuccess = () => { backupVal = reqBackup.result || null; };
          tx.oncomplete = () => {
            const valid = [primaryVal, backupVal].filter(isValidStatePayload);
            if (valid.length === 0) return resolve(null);
            valid.sort((a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
            resolve(valid[0]);
          };
          tx.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    };

    const saveToLargeCacheStorage = async (serializedJson) => {
      try {
        if (typeof window === 'undefined' || !('caches' in window)) return false;
        const cache = await window.caches.open(CACHE_STORAGE_NAME);
        const response = new Response(serializedJson, {
          headers: { 'Content-Type': 'application/json;charset=utf-8', 'X-Saved-At': String(Date.now()) }
        });
        await cache.put(CACHE_RECORD_URL, response);
        return true;
      } catch (e) {
        return false;
      }
    };

    const loadFromLargeCacheStorage = async () => {
      try {
        if (typeof window === 'undefined' || !('caches' in window)) return null;
        const cache = await window.caches.open(CACHE_STORAGE_NAME);
        const match = await cache.match(CACHE_RECORD_URL);
        if (!match) return null;

      }

    const persistPayloadSyncAndAsync = (payload) => {
      if (!isValidStatePayload(payload)) return { sizeKB: 0, localOk: false };
      let serialized = '';
      try {
        serialized = JSON.stringify(payload);
      } catch (e) {
        return { sizeKB: 0, localOk: false };
      }
      const sizeBytes = serialized.length * 2;
      const sizeKB = Math.max(1, Math.round(sizeBytes / 1024));

      let localOk = false;
      try {
        localStorage.setItem(STORAGE_KEY, serialized);
        localStorage.setItem(BACKUP_STORAGE_KEY, serialized);
        localOk = true;
      } catch (e) {
        try {
          localStorage.removeItem(BACKUP_STORAGE_KEY);
          localStorage.setItem(STORAGE_KEY, serialized);
          localOk = true;
        } catch (e2) {}
      }

      try {
        sessionStorage.setItem(STORAGE_KEY, serialized);
      } catch (e) {}

      try {
        if (serialized.length < 2500000) {
          window.name = WINDOW_NAME_PREFIX + serialized;
        }
      } catch (e) {}

      saveToLargeIndexedDB(payload);
      saveToLargeCacheStorage(serialized);
      return { sizeKB, sizeBytes, localOk };
    };

        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(() => {});
        }
      } catch (e) {}

      const syncData = loadSavedStateSync();
      const [idbData, cacheData] = await Promise.all([
        loadFromLargeIndexedDB(),
        loadFromLargeCacheStorage()
      ]);

      const candidates = [syncData, idbData, cacheData].filter(isValidStatePayload);
      if (candidates.length === 0) return null;

      candidates.sort((a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
      const best = candidates[0];

      try {
        const serialized = JSON.stringify(best);
        try { localStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
        try { sessionStorage.setItem(STORAGE_KEY, serialized); } catch (e) {}
        saveToLargeIndexedDB(best);
        saveToLargeCacheStorage(serialized);
      } catch (e) {}

      return best;
    };

    const calculateSubjectAverage = (scoreObj) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const ck = parseFloat(scoreObj.ck);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      const hasCK = !isNaN(ck) && ck >= 0 && ck <= 10;

      if (txValues.length === 0 && !hasGK && !hasCK) return null;

      let totalScore = txValues.reduce((a, b) => a + b, 0);
      let totalWeight = txValues.length;
      if (hasGK) { totalScore += gk * 2; totalWeight += 2; }
      if (hasCK) { totalScore += ck * 3; totalWeight += 3; }

      if (totalWeight === 0) return null;
      return Number((totalScore / totalWeight).toFixed(1));
    };

    const calculateFinalExamForecast = (scoreObj, targetAvg = 8.0) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      if (txValues.length === 0 && !hasGK) return null;

      let currentSum = txValues.reduce((a, b) => a + b, 0) + (hasGK ? gk * 2 : 0);
      let currentWeight = txValues.length + (hasGK ? 2 : 0);
      const totalWeightWithCK = currentWeight + 3;
      const neededCK = (targetAvg * totalWeightWithCK - currentSum) / 3;
      return Number(neededCK.toFixed(1));
    };

              : Math.round((target - todayZero) / (1000 * 60 * 60 * 24));
            const remindThreshold = Number(ev.remindBeforeDays ?? 7);
            const isCompleted = Boolean(ev.completed);
            const isOverdue = !isCompleted && diffDays < 0;
            const isDueToday = !isCompleted && diffDays === 0;
            const isDueSoon = !isCompleted && diffDays >= 0 && diffDays <= remindThreshold;
            const needsBellAlert = !isCompleted && diffDays <= remindThreshold;
            return {
              ...ev,
              timeSlot: ev.timeSlot || '08:00',
              priority: ev.priority || 'NORMAL',
              remindBeforeDays: remindThreshold,
              completed: isCompleted,
              diffDays,
              isOverdue,
              isDueToday,
              isDueSoon,
              needsBellAlert,
            };
          })
          .sort((a, b) => {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            return a.diffDays - b.diffDays;
          });
      }, [currentClassEvents, liveNow]);

      const bellAlertEvents = useMemo(() => {
        return enrichedTeacherEvents.filter((ev) => ev.needsBellAlert);
      }, [enrichedTeacherEvents]);

      const handleToggleTeacherEventCompleted = (eventId) => {
        const nowStr = new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        setClassEventsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((ev) => {
            if (ev.id !== eventId) return ev;
            const nextDone = !ev.completed;
            return {
              ...ev,
              completed: nextDone,
              completedAt: nextDone ? nowStr : '',
            };
          }),
        }));
        showToast('Đã cập nhật trạng thái hoàn thành nhiệm vụ/sự kiện!');
      };

      const handleAddTeacherEventSubmit = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!newEventForm.title.trim()) {
          showToast('Vui lòng nhập tên sự kiện hoặc nhiệm vụ cần thực hiện!');
          return;
        }
        const ev = {
          id: `EV${Date.now().toString().slice(-5)}`,
          title: newEventForm.title.trim(),
          targetDate: newEventForm.targetDate || formatISODate(new Date()),
          timeSlot: newEventForm.timeSlot || '08:00',
          category: newEventForm.category || 'Công tác GVCN',
          priority: newEventForm.priority || 'HIGH',
          remindBeforeDays: Number(newEventForm.remindBeforeDays) || 7,
          completed: false,
          completedAt: '',
          assignee: (newEventForm.assignee || 'GVCN & Cả lớp').trim(),
          note: (newEventForm.note || '').trim(),
        };
        setClassEventsByClass((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), ev],
        }));
        setNewEventForm((p) => ({ ...p, title: '', note: '' }));
        showToast(`Đã lên lịch sự kiện "${ev.title}" (${formatVNFullDate(ev.targetDate)})!`);
      };

      const handleDeleteTeacherEvent = (eventId) => {
        setClassEventsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).filter((x) => x.id !== eventId),
        }));
        showToast('Đã xóa sự kiện khỏi lịch công tác.');
      };

      const calendarGridCells = useMemo(() => {
        const { year, month } = calendarMonthYear;
        const firstDayOfMonth = new Date(year, month - 1, 1);
        const daysInMonth = new Date(year, month, 0).getDate();
        const startOffset = (firstDayOfMonth.getDay() + 6) % 7;

        const cells = [];
        const prevMonthDays = new Date(year, month - 1, 0).getDate();
        for (let i = startOffset - 1; i >= 0; i--) {
          const d = prevMonthDays - i;
          const dt = new Date(year, month - 2, d);
          const iso = formatISODate(dt);
          cells.push({
            iso,
            dayNum: d,
            inCurrentMonth: false,
            events: enrichedTeacherEvents.filter((ev) => ev.targetDate === iso),
          });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const dt = new Date(year, month - 1, d);
          const iso = formatISODate(dt);
          cells.push({
            iso,
            dayNum: d,
            inCurrentMonth: true,
            events: enrichedTeacherEvents.filter((ev) => ev.targetDate === iso),
          });
        }
        const remaining = (7 - (cells.length % 7)) % 7;
        for (let d = 1; d <= remaining; d++) {
          const dt = new Date(year, month, d);
          const iso = formatISODate(dt);
          cells.push({
            iso,
            dayNum: d,
            inCurrentMonth: false,
            events: enrichedTeacherEvents.filter((ev) => ev.targetDate === iso),
          });
        }
        return cells;
      }, [calendarMonthYear, enrichedTeacherEvents]);

      const [newCoachingForm, setNewCoachingForm] = useState({
        studentId: '',
        groupType: 'Phụ đạo củng cố',
        subject: mainSubject,
        schedule: 'Sáng Thứ 7',
        targetScore: 'ĐTB ≥ 6.5',
        progressNote: '',
      });

      const handleCascadeAll35WeeksFromCurrent = (anchorWeekNum, pickedDateISO) => {
        if (!pickedDateISO) return;
        const parsed = new Date(pickedDateISO + 'T00:00:00');
        if (isNaN(parsed.getTime())) return;
        const anchorSunday = getSundayOfDate(parsed);

        const newMap = {};
        for (let w = 1; w <= 35; w++) {
          const diffWeeks = w - anchorWeekNum;
          const sun = new Date(anchorSunday);
          sun.setDate(anchorSunday.getDate() + diffWeeks * 7);
          const sat = new Date(sun);
          sat.setDate(sun.getDate() + 6);
          newMap[w] = {
            semester: w <= 18 ? 'Học kỳ 1' : 'Học kỳ 2',
            startSunday: formatISODate(sun),
            endSaturday: formatISODate(sat),
          };
        }
        updateYearField('weekDates', newMap);
        showToast(
          `Đã lấy Tuần ${anchorWeekNum} (CN ${formatVNFullDate(formatISODate(anchorSunday))}) làm mốc và tự động cập nhật lịch cả 35 tuần!`
        );
      };

      const handleFindAndJumpToWeekByDate = (isoDateStr) => {
        if (!isoDateStr) return;
        const targetSunISO = formatISODate(getSundayOfDate(new Date(isoDateStr + 'T00:00:00')));
        let foundWeek = null;
        for (let w = 1; w <= 35; w++) {
          if (weekDatesMap[w]?.startSunday === targetSunISO) {
            foundWeek = w;
            break;
          }
        }
        if (foundWeek) {
          handleSelectWeek(foundWeek);
          showToast(`Ngày ${formatVNFullDate(isoDateStr)} thuộc Tuần ${foundWeek} (CN → T7)!`);
        } else {
          handleAdjustWeekByAnyDate(selectedWeek, isoDateStr);
        }
      };

      useEffect(() => {
        if (currentStudents.length > 0) {
          const firstId = currentStudents[0].id;
          if (!selectedCommStudentId || !currentStudents.some((s) => s.id === selectedCommStudentId)) {
            setSelectedCommStudentId(firstId);
          }
          if (!newLeaveForm.studentId) setNewLeaveForm((p) => ({ ...p, studentId: firstId }));
          if (!newParentLogForm.studentId) setNewParentLogForm((p) => ({ ...p, studentId: firstId }));
          if (!newCounselingForm.studentId) setNewCounselingForm((p) => ({ ...p, studentId: firstId }));
          if (!newEquipmentForm.studentId) setNewEquipmentForm((p) => ({ ...p, studentId: firstId }));
          if (!newCoachingForm.studentId) setNewCoachingForm((p) => ({ ...p, studentId: firstId }));
          if (!parentMeetingMinuteForm.studentId) setParentMeetingMinuteForm((p) => ({ ...p, studentId: firstId }));
        }
      }, [currentStudents, activeClass]);

      const isStudentTakingVocational = (stu) => {
        if (typeof stu.hasVocational === 'boolean') return stu.hasVocational;
        return stu.vocational && stu.vocational !== 'Không học nghề';
      };

      const rosterStudents = useMemo(() => {
        if (rosterFilterMode === 'VOCATIONAL_ONLY') {
          return currentStudents.filter((s) => isStudentTakingVocational(s));
        }
        return currentStudents;
      }, [currentStudents, rosterFilterMode]);

      const filteredStudents = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return rosterStudents;
        return rosterStudents.filter(
          (s) =>
            s.name.toLowerCase().includes(q) ||
            (s.moetId || s.id || '').toLowerCase().includes(q) ||
            (s.status || '').toLowerCase().includes(q) ||
            (s.vocational || '').toLowerCase().includes(q) ||
            (s.role || '').toLowerCase().includes(q) ||
            (s.studentPhone || '').includes(q) ||
            (s.parentPhone || '').includes(q) ||
            (s.specialNote || '').toLowerCase().includes(q)
        );
      }, [rosterStudents, searchQuery]);

      // ============================================================================
      // TÍNH TOÁN CHUYÊN CẦN TUẦN, THÁNG & CẢ NĂM + BIỂU ĐỒ CẢNH BÁO NGHỈ HỌC QUÁ NHIỀU
      // ============================================================================
      const getStudentWeekRecord = (stuId, weekNum = selectedWeek) => {
        return attendance[activeClass]?.[weekNum]?.[stuId] || {};
      };

      const getStudentDaySessionCodes = (stuId, dayKey, sessionKey = 'S', weekNum = selectedWeek) => {
        const rec = getStudentWeekRecord(stuId, weekNum);
        const sessionField = `${dayKey}_${sessionKey}`;
        if (Array.isArray(rec[sessionField])) return rec[sessionField];
        if (sessionKey === 'S' && Array.isArray(rec[dayKey])) return rec[dayKey];
        return [];
      };

      const calculateWeeklyConductScore = (stuId, weekNum = selectedWeek) => {
        let score = 100;
        let totalAbsentP = 0;
        let rawAbsentK = 0;
        let skipClassCT = 0;
        let totalAbsentK = 0;
        let totalLate = 0;
        let repeatMinorCount = 0;
        let totalPlus = 0;
        let totalViolations = 0;
        const detailList = [];

        DAYS_OF_WEEK.forEach((d) => {
          SESSIONS_OF_DAY.forEach((ses) => {
            const codes = getStudentDaySessionCodes(stuId, d.key, ses.key, weekNum);
            codes.forEach((code) => {
              const typeObj = attendanceTypes.find((t) => t.id === code);
              if (typeObj) {
                score += Number(typeObj.points || 0);
                const eq = typeObj.equivAbsent || (code === 'K' || code === 'CT' ? 'K' : code === 'P' ? 'P' : typeObj.points < 0 ? 'REPEAT_WARN' : 'NONE');
                if (code === 'P' || eq === 'P') {
                  totalAbsentP += 1;
                }
                if (code === 'K') {
                  rawAbsentK += 1;
                  totalAbsentK += 1;
                } else if (code === 'CT' || eq === 'K') {
                  skipClassCT += 1;
                  totalAbsentK += 1; // Cúp tiết nghiêm trọng tính thẳng vào lũy kế Nghỉ Không Phép (K)
                }
                if (code === 'M') totalLate += 1;
                if (eq === 'REPEAT_WARN' || (typeObj.points < 0 && code !== 'P' && code !== 'K' && code !== 'CT')) {
                  repeatMinorCount += 1;
                }
                if (typeObj.points > 0) totalPlus += 1;
                if (typeObj.points < 0 && code !== 'P' && eq !== 'P') totalViolations += 1;
                if (typeObj.points < 0) {
                  const tagNote = (code === 'CT' || (eq === 'K' && code !== 'K')) ? ' [Tính lũy kế = Nghỉ KP]' : '';
                  detailList.push(`${d.label} (${ses.shortLabel}): [${code}] ${typeObj.label}${tagNote}`);
                }
              }
            });
          });
        });

        // Quy đổi nhắc nhở khi tái phạm lỗi tương đương nghỉ có phép / không phép nhiều lần
        const convertedAbsentFromRepeats = Math.floor(repeatMinorCount / 2);
        const equivWarningLabels = [];
        if (skipClassCT > 0) {
          equivWarningLabels.push(`🚨 Cúp tiết nghiêm trọng (${skipClassCT} lần → Tính = ${skipClassCT} buổi Nghỉ KP lũy kế)`);
        }
        if (rawAbsentK >= 1 && skipClassCT >= 1) {
          equivWarningLabels.push(`🚨 Tổng lũy kế Nghỉ KP + Cúp tiết: ${totalAbsentK} buổi (${rawAbsentK}K + ${skipClassCT}CT)`);
        } else if (rawAbsentK >= 2) {
          equivWarningLabels.push(`🚨 Nghỉ không phép nhiều lần (${rawAbsentK} buổi/tuần)`);
        }
        if (totalAbsentP >= 2) {
          equivWarningLabels.push(`⚠️ Nghỉ có phép nhiều lần (${totalAbsentP} buổi/tuần — Nhắc chép bài)`);
        }
        if (repeatMinorCount >= 2) {
          equivWarningLabels.push(`⚠️ Lỗi tương đương nghỉ KP/CP lặp lại (${repeatMinorCount} lần vi phạm ≈ ${convertedAbsentFromRepeats} buổi nghỉ)`);
        }

        const clamped = Math.max(0, Math.min(120, score));
        let rank = 'Tốt';
        if (clamped < 65 || totalAbsentK >= 2) rank = 'Chưa đạt';
        else if (clamped < 80 || totalAbsentK === 1 || convertedAbsentFromRepeats >= 2) rank = 'Đạt';
        else if (clamped < 90 || convertedAbsentFromRepeats === 1) rank = 'Khá';

        return {
          score: clamped,
          rank,
          totalAbsentP,
          rawAbsentK,
          skipClassCT,
          totalAbsentK,
          totalLate,
          repeatMinorCount,
          convertedAbsentFromRepeats,
          equivWarningLabels,
          totalPlus,
          totalViolations,
          detailList,
        };
      };

      // Xác định danh sách các Tuần thuộc Tháng đang chọn (dựa trên lịch thực tế hoặc cấu hình tháng)
      const weeksOfMonthMap = useMemo(() => {
        const result = {};
        SCHOOL_MONTHS_LIST.forEach((mObj) => {
          const matched = [];
          for (let w = 1; w <= 35; w++) {
            const wInfo = weekDatesMap[w];
            if (wInfo && wInfo.endSaturday) {
              const endMonth = parseInt(wInfo.endSaturday.split('-')[1], 10);
              if (endMonth === mObj.month) matched.push(w);
            }
          }
          result[mObj.month] = matched.length > 0 ? matched : mObj.defaultWeeks;
        });
        return result;
      }, [weekDatesMap]);

      const currentMonthWeeks = useMemo(() => {
        return weeksOfMonthMap[selectedReportMonth] || [9, 10, 11, 12];
      }, [weeksOfMonthMap, selectedReportMonth]);

      // TÍNH TOÁN TỔNG HỢP VI PHẠM & CHUYÊN CẦN THEO THÁNG CHO TỪNG HỌC SINH
      const calculateMonthlyConductSummary = useCallback((stuId, targetMonth = selectedReportMonth) => {
        const weeks = weeksOfMonthMap[targetMonth] || [9, 10, 11, 12];
        let absentP = 0;
        let absentK = 0;
        let rawAbsentK = 0;
        let skipClassCT = 0;
        let repeatMinorCount = 0;
        let lateM = 0;
        let plusCount = 0;
        let violationCount = 0;
        let scoreSum = 0;
        const weeklyBreakdown = [];
        const allMonthDetails = [];
        const allMonthDetailRows = [];

        weeks.forEach((wNum) => {
          const wStat = calculateWeeklyConductScore(stuId, wNum);
          const wInfo = weekDatesMap[wNum] || {};
          const baseSun = wInfo.startSunday ? new Date(wInfo.startSunday + 'T00:00:00') : null;
          absentP += wStat.totalAbsentP;
          absentK += wStat.totalAbsentK;
          rawAbsentK += (wStat.rawAbsentK || 0);
          skipClassCT += (wStat.skipClassCT || 0);
          repeatMinorCount += (wStat.repeatMinorCount || 0);
          lateM += wStat.totalLate;
          plusCount += wStat.totalPlus;
          violationCount += wStat.totalViolations;
          scoreSum += wStat.score;

          DAYS_OF_WEEK.forEach((d) => {
            let vnDateStr = '';
            if (baseSun && !isNaN(baseSun.getTime())) {
              const dtObj = new Date(baseSun);
              dtObj.setDate(baseSun.getDate() + d.offset);
              vnDateStr = formatVNShortDate(formatISODate(dtObj));
            }
            SESSIONS_OF_DAY.forEach((ses) => {
              const codes = getStudentDaySessionCodes(stuId, d.key, ses.key, wNum);
              codes.forEach((code) => {
                const typeObj = attendanceTypes.find((t) => t.id === code);
                if (typeObj && typeObj.points < 0) {
                  const eq = typeObj.equivAbsent || (code === 'K' || code === 'CT' ? 'K' : code === 'P' ? 'P' : 'REPEAT_WARN');
                  const equivNote = code === 'CT' || (eq === 'K' && code !== 'K') ? ' [Tính lũy kế = Nghỉ KP]' : '';
                  const detailStr = `Tuần ${wNum} - ${d.label}${vnDateStr ? ' (' + vnDateStr + ')' : ''} - ${ses.shortLabel}: [${code}] ${typeObj.label}${equivNote}`;
                  allMonthDetails.push(detailStr);
                  allMonthDetailRows.push({
                    weekNum: wNum,
                    dayLabel: d.label,
                    vnDate: vnDateStr,
                    sessionLabel: ses.shortLabel,
                    code,
                    label: typeObj.label + equivNote,
                    points: Number(typeObj.points || 0),
                    remark:
                      code === 'K' || code === 'CT' || eq === 'K'
                        ? 'Nghỉ KP / Cúp tiết (tính vào lũy kế) — PH cần xác nhận & đôn đốc đi học.'
                        : code === 'P' || eq === 'P'
                        ? 'Nghỉ có phép — Nhắc học sinh chép bài và hoàn thành bài tập.'
                        : 'Vi phạm nề nếp — Yêu cầu học sinh nghiêm túc khắc phục, không tái phạm.',
                  });
                }
              });
            });
          });
          weeklyBreakdown.push({
            weekNum: wNum,
            dateRange: `CN ${formatVNShortDate(wInfo.startSunday)} → T7 ${formatVNShortDate(wInfo.endSaturday)}`,
            score: wStat.score,
            rank: wStat.rank,
            absentP: wStat.totalAbsentP,
            absentK: wStat.totalAbsentK,
            lateM: wStat.totalLate,
            violationCount: wStat.totalViolations,
            plusCount: wStat.totalPlus,
            details: wStat.detailList,
          });
        });

        const totalAbsent = absentP + absentK;
        const avgScore = weeks.length > 0 ? Math.round(scoreSum / weeks.length) : 100;
        let monthRank = 'Tốt';
        if (avgScore < 65 || absentK >= 3 || totalAbsent >= 6) monthRank = 'Chưa đạt';
        else if (avgScore < 80 || absentK >= 2 || totalAbsent >= 4) monthRank = 'Đạt';
        else if (avgScore < 90 || absentK >= 1 || totalAbsent >= 2) monthRank = 'Khá';

        const isExcessiveAbsence =
          totalAbsent >= Number(monthlyAbsentWarnThreshold || 3) ||
          absentK >= Number(monthlyUnexcusedWarnThreshold || 2);

        return {
          month: targetMonth,
          weeks,
          absentP,
          absentK,
          rawAbsentK,
          skipClassCT,
          repeatMinorCount,
          convertedAbsentFromRepeats: Math.floor(repeatMinorCount / 3),
          totalAbsent,
          lateM,
          plusCount,
          violationCount,
          totalIssues: violationCount + absentP,
          avgScore,
          monthRank,
          isExcessiveAbsence,
          weeklyBreakdown,
          allMonthDetails,
          allMonthDetailRows,
        };
      }, [weeksOfMonthMap, selectedReportMonth, attendance, activeClass, attendanceTypes, weekDatesMap, monthlyAbsentWarnThreshold, monthlyUnexcusedWarnThreshold]);

      const calculateYearAttendanceSummary = (stuId) => {
        const classAtt = attendance[activeClass] || {};
        let absentP = 0;
        let absentK = 0;
        let late = 0;
        let plusCount = 0;
        let totalViolations = 0;
        let totalScoreSum = 0;
        let trackedWeeks = 0;

        Object.keys(classAtt).forEach((wKey) => {
          const wSummary = calculateWeeklyConductScore(stuId, Number(wKey));
          absentP += wSummary.totalAbsentP;
          absentK += wSummary.totalAbsentK;
          late += wSummary.totalLate;
          plusCount += wSummary.totalPlus;
          totalViolations += wSummary.totalViolations;
          totalScoreSum += wSummary.score;
          trackedWeeks += 1;
        });

        const avgConductScore = trackedWeeks > 0 ? Math.round(totalScoreSum / trackedWeeks) : 100;
        let yearConductRank = 'Tốt';
        if (avgConductScore < 65 || absentK >= 5) yearConductRank = 'Chưa đạt';
        else if (avgConductScore < 80) yearConductRank = 'Đạt';
        else if (avgConductScore < 90) yearConductRank = 'Khá';

        return {
          absentP,
          absentK,
          late,
          plusCount,
          totalViolations,
          avgConductScore,
          yearConductRank,
        };
      };

      const violationAnalytics = useMemo(() => {
        const dayCounts = { CN: 0, T2: 0, T3: 0, T4: 0, T5: 0, T6: 0, T7: 0 };
        const typeCounts = {};
        attendanceTypes.forEach((t) => {
          if (t.points < 0) typeCounts[t.id] = 0;
        });

        // Thống kê mật độ theo từng tuần trong tháng đang chọn
        const monthWeekStats = currentMonthWeeks.map((wNum) => {
          let wAbsent = 0;
          let wViolations = 0;
          currentStudents.forEach((stu) => {
            const ws = calculateWeeklyConductScore(stu.id, wNum);
            wAbsent += ws.totalAbsentK + ws.totalAbsentP;
            wViolations += ws.totalViolations;
          });
          return { weekNum: wNum, absentCount: wAbsent, violationCount: wViolations };
        });

        const studentStats = currentStudents.map((stu) => {
          if (violationChartScope === 'WEEK') {
            const w = calculateWeeklyConductScore(stu.id, selectedWeek);
            const details = [];
            DAYS_OF_WEEK.forEach((d) => {
              SESSIONS_OF_DAY.forEach((ses) => {
                const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, selectedWeek);
                codes.forEach((c) => {
                  const t = attendanceTypes.find((x) => x.id === c);
                  if (t && t.points < 0) {
                    dayCounts[d.key] = (dayCounts[d.key] || 0) + 1;
                    typeCounts[c] = (typeCounts[c] || 0) + 1;
                    details.push(`${d.label} (${ses.shortLabel}): ${t.label}`);
                  }
                });
              });
            });
            return {
              student: stu,
              violationCount: w.totalViolations + w.totalAbsentP,
              unexcusedK: w.totalAbsentK,
              excusedP: w.totalAbsentP,
              totalAbsent: w.totalAbsentK + w.totalAbsentP,
              lateM: w.totalLate,
              conductScore: w.score,
              conductRank: w.rank,
              isExcessiveAbsence: w.totalAbsentK >= 1 || w.totalAbsentK + w.totalAbsentP >= 2,
              details,
            };
          } else if (violationChartScope === 'MONTH') {
            const m = calculateMonthlyConductSummary(stu.id, selectedReportMonth);
            m.weeks.forEach((wNum) => {
              DAYS_OF_WEEK.forEach((d) => {
                SESSIONS_OF_DAY.forEach((ses) => {
                  const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, wNum);
                  codes.forEach((c) => {
                    const t = attendanceTypes.find((x) => x.id === c);
                    if (t && t.points < 0) {
                      dayCounts[d.key] = (dayCounts[d.key] || 0) + 1;
                      typeCounts[c] = (typeCounts[c] || 0) + 1;
                    }
                  });
                });
              });
            });
            return {
              student: stu,
              violationCount: m.totalIssues,
              unexcusedK: m.absentK,
              excusedP: m.absentP,
              totalAbsent: m.totalAbsent,
              lateM: m.lateM,
              conductScore: m.avgScore,
              conductRank: m.monthRank,
              isExcessiveAbsence: m.isExcessiveAbsence,
              details: m.allMonthDetails,
            };
          } else {
            const y = calculateYearAttendanceSummary(stu.id);
            const classAtt = attendance[activeClass] || {};
            const details = [];
            Object.keys(classAtt).forEach((wKey) => {

              violationCount += c.totalViolations + c.totalAbsentK;
            });
            const avgConduct = Number((sumConduct / members.length).toFixed(1));
            return { teamNum, count: members.length, avgConduct, plusCount, violationCount, totalPoints: avgConduct };
          })
          .sort((a, b) => b.totalPoints - a.totalPoints);
      }, [currentStudents, attendance, activeClass, selectedWeek, teamNumberList]);

      const getStudentSubjectScoreObj = (stuId, subj = selectedSubject, sem = semester) => {
        return (
          grades[activeClass]?.[sem]?.[subj]?.[stuId] || {
            tx1: '', tx2: '', tx3: '', tx4: '', gk: '', ck: '', comment: '',
          }
        );
      };

      const getSubjectWholeYearAvg = (stuId, subj) => {
        const hk1 = calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, 'Học kỳ 1'));
        const hk2 = calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, 'Học kỳ 2'));
        if (hk1 !== null && hk2 !== null) return Number(((hk1 + hk2 * 2) / 3).toFixed(1));
        if (hk1 !== null) return hk1;
        if (hk2 !== null) return hk2;
        return null;
      };

      const getStudentOverallGPA = (stuId, mode = summaryPeriodMode) => {
        const validScores = currentSubjects
          .map((subj) =>
            mode === 'WHOLE_YEAR'
              ? getSubjectWholeYearAvg(stuId, subj)
              : calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, semester))
          )
          .filter((v) => v !== null);
        if (validScores.length === 0) return null;
        return Number((validScores.reduce((a, b) => a + b, 0) / validScores.length).toFixed(1));
      };

      const classifyAcademicRank = (gpa) => {
        if (gpa === null) return 'Chưa đủ điểm';
        if (gpa >= 8.0) return 'Tốt (Giỏi)';
        if (gpa >= 6.5) return 'Khá';
        if (gpa >= 5.0) return 'Đạt';
        return 'Chưa đạt';
      };

      const getHonorTitle = (gpa, conductRank) => {
        if (gpa === null) return 'Chưa xét';
        if (gpa >= 9.0 && conductRank === 'Tốt') return 'Học sinh Xuất sắc';
        if (gpa >= 8.0 && conductRank === 'Tốt') return 'Học sinh Giỏi';
        if (gpa >= 6.5 && (conductRank === 'Tốt' || conductRank === 'Khá')) return 'Học sinh Tiên tiến';
        return 'Hoàn thành';
      };

      // 2. PHÂN TÍCH ĐÀ TIẾN BỘ CÁ NHÂN
      const analyzeStudentProgress = useCallback((stu, targetSubj = selectedSubject) => {
        const scoreObj = getStudentSubjectScoreObj(stu.id, targetSubj, semester);
        const stageDefs = [
          { key: 'tx1', label: 'TX1' },
          { key: 'tx2', label: 'TX2' },
          { key: 'tx3', label: 'TX3' },
          { key: 'tx4', label: 'TX4' },
          { key: 'gk', label: 'GK' },
          { key: 'ck', label: 'CK' },
        ];
        const stagePoints = stageDefs.map((st) => {
          const val = parseFloat(scoreObj?.[st.key]);
          return {
            ...st,
            value: !isNaN(val) && val >= 0 && val <= 10 ? val : null,
          };
        });
        const validPoints = stagePoints.filter((p) => p.value !== null);
        const firstScore = validPoints.length > 0 ? validPoints[0].value : null;
        const latestScore = validPoints.length > 0 ? validPoints[validPoints.length - 1].value : null;
        const scoreDelta =
          firstScore !== null && latestScore !== null && validPoints.length >= 2
            ? Number((latestScore - firstScore).toFixed(1))
            : 0;

        const subjAvg = calculateSubjectAverage(scoreObj);
        const overallGPA = getStudentOverallGPA(stu.id, summaryPeriodMode);
        const weekCond = calculateWeeklyConductScore(stu.id, selectedWeek);
        const prevWeekCond = calculateWeeklyConductScore(stu.id, Math.max(1, selectedWeek - 1));
        const conductDelta = weekCond.score - prevWeekCond.score;

        let trendType = 'STABLE';
        let trendLabel = 'Phong độ ổn định';
        if (scoreDelta >= 0.5 || (scoreDelta >= 0.2 && weekCond.score >= 98 && (subjAvg ?? 0) >= 8.0)) {
          trendType = 'UP';
          trendLabel = 'Đang tiến bộ / Bứt phá';
        } else if (
          scoreDelta <= -0.5 ||
          (subjAvg !== null && subjAvg < 5.5) ||
          weekCond.score < 85 ||
          stu.attitude === 'Còn thụ động' ||
          stu.attitude === 'Cần nhắc nhở'
        ) {
          trendType = 'DOWN';
          trendLabel = 'Đang tụt dốc • Cần kèm cặp';
        }

        return {
          stagePoints,
          validPoints,
          firstScore,
          latestScore,
          scoreDelta,
          subjAvg,
          overallGPA,
          weekConductScore: weekCond.score,
          conductDelta,
          trendType,
          trendLabel,
        };
      }, [grades, activeClass, semester, selectedSubject, summaryPeriodMode, attendance, selectedWeek]);

      // 3. RADAR DÒ CẢNH BÁO SỚM CẤM THI / NGUY CƠ Ở LẠI LỚP
      const academicRiskRadar = useMemo(() => {
        const MAX_ABSENT_QUOTA = 45;
        const items = currentStudents.map((stu) => {
          const yearCond = calculateYearAttendanceSummary(stu.id);
          const monthCond = calculateMonthlyConductSummary(stu.id, selectedReportMonth);
          const weekCond = calculateWeeklyConductScore(stu.id, selectedWeek);
          const totalAbsentSessions = yearCond.absentP + yearCond.absentK;
          const absentQuotaPct = Math.min(100, Math.round((totalAbsentSessions / MAX_ABSENT_QUOTA) * 100));

          const subjectDetails = currentSubjects.map((subj) => {
            const scObj = getStudentSubjectScoreObj(stu.id, subj, semester);
            const avg =
              summaryPeriodMode === 'WHOLE_YEAR'
                ? getSubjectWholeYearAvg(stu.id, subj)
                : calculateSubjectAverage(scObj);
            const neededCKForPass = calculateFinalExamForecast(scObj, 5.0);
            return {
              subject: subj,
              avg,
              neededCKForPass,
              isCritical: avg !== null && avg <= 3.5,
              isBelowPass: avg !== null && avg < 5.0,
              isNearBorder: avg !== null && avg >= 5.0 && avg < 6.0,
            };
          });

          const criticalSubjects = subjectDetails.filter((s) => s.isCritical);
          const belowPassSubjects = subjectDetails.filter((s) => s.isBelowPass);
          const nearBorderSubjects = subjectDetails.filter((s) => s.isNearBorder);
          const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);
          const prog = analyzeStudentProgress(stu, selectedSubject);

          const reasons = [];
          let riskScore = 0;

          if (monthCond.isExcessiveAbsence || yearCond.absentK >= 3 || totalAbsentSessions >= 12) {
            riskScore += 60;
            reasons.push(`Nghỉ nhiều trong Tháng ${selectedReportMonth}: ${monthCond.totalAbsent} buổi (${monthCond.absentK}K, ${monthCond.absentP}P) | Cả năm: ${totalAbsentSessions}/45 buổi`);
          } else if (yearCond.absentK >= 1 || totalAbsentSessions >= 2 || yearCond.late >= 2) {
            riskScore += 30;
            reasons.push(`Chuyên cần: Vắng ${yearCond.absentK}K, ${yearCond.absentP}P, Muộn ${yearCond.late} lần`);
          }

          if (criticalSubjects.length > 0) {
            riskScore += 70;
            reasons.push(`Vướng điểm liệt (≤ 3.5): ${criticalSubjects.map((s) => `${s.subject} (${s.avg})`).join(', ')}`);
          }
          if (belowPassSubjects.length >= 2) {
            riskScore += 60;
            reasons.push(`Dưới TB (< 5.0) từ 2 môn: ${belowPassSubjects.map((s) => `${s.subject} (${s.avg})`).join(', ')}`);
          } else if (belowPassSubjects.length === 1) {
            riskScore += 35;
            reasons.push(`Môn dưới 5.0: ${belowPassSubjects[0].subject} (${belowPassSubjects[0].avg})`);
          } else if (nearBorderSubjects.length > 0) {
            riskScore += 20;
            reasons.push(`Điểm sát ngưỡng 5.0: ${nearBorderSubjects.map((s) => `${s.subject} (${s.avg})`).join(', ')}`);
          }

          if (weekCond.score < 80 || yearCond.avgConductScore < 80) {
            riskScore += 25;
            reasons.push(`Điểm rèn luyện thấp (${weekCond.score}đ tuần này / TB tháng ${monthCond.avgScore}đ)`);
          }
          if (prog.trendType === 'DOWN' && reasons.length === 0) {
            riskScore += 20;
            reasons.push(`Phong độ học tập đang giảm (${prog.scoreDelta}đ môn ${selectedSubject}) hoặc còn thụ động`);
          }

          let riskLevel = 'SAFE';
          if (
            riskScore >= 55 ||
            monthCond.isExcessiveAbsence ||
            criticalSubjects.length > 0 ||
            belowPassSubjects.length >= 2 ||
            yearCond.absentK >= 3 ||
            yearCond.yearConductRank === 'Chưa đạt'
          ) {
            riskLevel = 'DANGER';
          } else if (riskScore >= 20 || belowPassSubjects.length === 1 || yearCond.absentK >= 1 || prog.trendType === 'DOWN') {
            riskLevel = 'WARNING';
          }

          return {
            student: stu,
            riskLevel,
            riskScore: Math.min(100, riskScore),
            reasons,
            yearCond,
            monthCond,
            weekCond,
            totalAbsentSessions,
            absentQuotaPct,
            criticalSubjects,
            belowPassSubjects,
            nearBorderSubjects,
            gpa,
            progress: prog,
          };
        });

        const dangerList = items.filter((i) => i.riskLevel === 'DANGER').sort((a, b) => b.riskScore - a.riskScore);
        const warningList = items.filter((i) => i.riskLevel === 'WARNING').sort((a, b) => b.riskScore - a.riskScore);
        const safeList = items.filter((i) => i.riskLevel === 'SAFE');

        return {
          allItems: items.sort((a, b) => b.riskScore - a.riskScore),
          dangerList,
          warningList,
          safeList,
        };
      }, [currentStudents, attendance, grades, activeClass, selectedWeek, selectedReportMonth, semester, summaryPeriodMode, currentSubjects, selectedSubject, analyzeStudentProgress, calculateMonthlyConductSummary]);

      // 4. MA TRẬN GHÉP ĐÔI "ĐÔI BẠN CÙNG TIẾN" & TỰ ĐỘNG XẾP CHỖ NGỒI CÙNG BÀN
      const currentPeerPairs = useMemo(() => {
        return ((currentYearData.peerPairsByClass || {})[activeClass]) || [];
      }, [currentYearData.peerPairsByClass, activeClass]);

      const peerPairByDeskMap = useMemo(() => {
        const map = {};
        currentPeerPairs.forEach((pair) => {
          const mentor = currentStudents.find((s) => s.id === pair.mentorId);
          const mentee = currentStudents.find((s) => s.id === pair.menteeId);
          if (!mentor || !mentee) return;
          const slotA = mentor.deskSlot || pair.deskSlotA || '';
          const slotB = mentee.deskSlot || pair.deskSlotB || '';
          const prefixA = slotA.split('-').slice(0, 2).join('-');
          const prefixB = slotB.split('-').slice(0, 2).join('-');
          const deskKey = prefixA && prefixA === prefixB ? prefixA : pair.deskKey || prefixA;
          if (deskKey) {
            map[deskKey] = {
              ...pair,
              mentor,
              mentee,
            };
          }
        });
        return map;
      }, [currentPeerPairs, currentStudents]);

      const handleAutoPairAndSeatBuddies = () => {
        if (currentStudents.length < 2) {
          showToast('Cần ít nhất 2 học sinh trong lớp để ghép Đôi bạn cùng tiến!');
          return;
        }
        const cols = seatLayoutConfig.cols || 4;
        const desksPerCol = seatLayoutConfig.desksPerCol || 5;
        if (seatLayoutConfig.seatsPerDesk < 2) {
          setSeatLayoutConfig((prev) => ({ ...prev, seatsPerDesk: 2 }));
        }

        const scoredList = currentStudents.map((stu) => {
          const subjAvg = calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester));
          const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);
          const academicScore = subjAvg ?? gpa ?? 6.8;
          const yCond = calculateYearAttendanceSummary(stu.id);
          const composite = academicScore * 10 + yCond.avgConductScore * 0.15;
          return {
            stu,
            academicScore,
            conductScore: yCond.avgConductScore,
            composite,
          };
        });

        const sortedDesc = [...scoredList].sort((a, b) => b.composite - a.composite);
        const pairCount = Math.floor(sortedDesc.length / 2);
        const mentors = sortedDesc.slice(0, pairCount);
        const mentees = sortedDesc.slice(sortedDesc.length - pairCount).reverse();
        const unpairedMiddle = sortedDesc.length % 2 === 1 ? [sortedDesc[pairCount]] : [];

        const availableDesks = [];
        for (let r = 1; r <= desksPerCol; r++) {
          for (let c = 1; c <= cols; c++) {
            availableDesks.push({ col: c, desk: r, deskKey: `${c}-${r}` });
          }
        }

        const newPairs = [];
        const newDeskAssignmentMap = {};

        mentors.forEach((mItem, idx) => {
          const tItem = mentees[idx];
          const targetDesk = availableDesks[idx] || { col: (idx % cols) + 1, desk: Math.floor(idx / cols) + 1, deskKey: `${(idx % cols) + 1}-${Math.floor(idx / cols) + 1}` };
          const slotMentor = `${targetDesk.col}-${targetDesk.desk}-1`;
          const slotMentee = `${targetDesk.col}-${targetDesk.desk}-2`;

          newDeskAssignmentMap[mItem.stu.id] = { deskSlot: slotMentor, team: targetDesk.col };
          newDeskAssignmentMap[tItem.stu.id] = { deskSlot: slotMentee, team: targetDesk.col };

          newPairs.push({
            id: `PAIR_${Date.now()}_${idx}`,
            mentorId: mItem.stu.id,
            menteeId: tItem.stu.id,
            subjectFocus: selectedSubject,
            deskKey: targetDesk.deskKey,
            deskLabel: `Dãy ${targetDesk.col} • Bàn ${targetDesk.desk}`,
            deskSlotA: slotMentor,
            deskSlotB: slotMentee,
            baselineMenteeScore: tItem.academicScore,
            targetMenteeScore: Number(Math.min(10, Math.max(6.5, tItem.academicScore + 1.2)).toFixed(1)),
            createdAtWeek: selectedWeek,
            note: `Kèm môn ${selectedSubject} & hỗ trợ bài tập trên lớp`,
          });
        });

        if (unpairedMiddle.length === 1) {
          const remStu = unpairedMiddle[0].stu;
          const nextDesk = availableDesks[pairCount];
          if (nextDesk) {
            newDeskAssignmentMap[remStu.id] = {
              deskSlot: `${nextDesk.col}-${nextDesk.desk}-1`,
              team: nextDesk.col,
            };
          }
        }

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) =>
            newDeskAssignmentMap[s.id]
              ? { ...s, deskSlot: newDeskAssignmentMap[s.id].deskSlot, team: newDeskAssignmentMap[s.id].team }
              : s
          ),
        }));

        setPeerPairsByClass((prev) => ({
          ...(prev || {}),
          [activeClass]: newPairs,
        }));

        showToast(`Đã ghép ${newPairs.length} cặp "Đôi bạn cùng tiến" và tự động xếp ngồi cùng bàn trên Sơ đồ lớp!`);
      };

      const handleSeatSinglePairTogether = (pair) => {
        const [colStr, deskStr] = (pair.deskKey || '1-1').split('-');
        const colNum = Number(colStr) || 1;
        const deskNum = Number(deskStr) || 1;
        const slotA = `${colNum}-${deskNum}-1`;
        const slotB = `${colNum}-${deskNum}-2`;

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) => {
            if (s.id === pair.mentorId) return { ...s, deskSlot: slotA, team: colNum };
            if (s.id === pair.menteeId) return { ...s, deskSlot: slotB, team: colNum };
            if (s.deskSlot === slotA || s.deskSlot === slotB) return { ...s, deskSlot: '' };
            return s;
          }),
        }));
        showToast(`Đã xếp cặp Đôi bạn cùng tiến ngồi cùng nhau tại Dãy ${colNum} - Bàn ${deskNum}!`);
      };

      const handleAddCustomPeerPair = (e) => {
        e.preventDefault();
        const { mentorId, menteeId, subjectFocus, targetCol, targetDesk, note } = customPairForm;
        if (!mentorId || !menteeId || mentorId === menteeId) {
          showToast('Vui lòng chọn 2 học sinh khác nhau để ghép đôi!');
          return;
        }
        const curScore = calculateSubjectAverage(getStudentSubjectScoreObj(menteeId, subjectFocus || selectedSubject, semester)) ?? getStudentOverallGPA(menteeId) ?? 5.5;
        const colNum = Number(targetCol) || 1;
        const deskNum = Number(targetDesk) || 1;
        const slotA = `${colNum}-${deskNum}-1`;
        const slotB = `${colNum}-${deskNum}-2`;

        const newPair = {
          id: `PAIR_${Date.now()}`,
          mentorId,
          menteeId,
          subjectFocus: subjectFocus || selectedSubject,
          deskKey: `${colNum}-${deskNum}`,
          deskLabel: `Dãy ${colNum} • Bàn ${deskNum}`,
          deskSlotA: slotA,
          deskSlotB: slotB,
          baselineMenteeScore: curScore,
          targetMenteeScore: Number(Math.min(10, Math.max(6.5, curScore + 1.0)).toFixed(1)),
          createdAtWeek: selectedWeek,
          note: note || `Kèm cặp môn ${subjectFocus || selectedSubject}`,
        };

        setPeerPairsByClass((prev) => ({
          ...(prev || {}),
          [activeClass]: [
            ...(((prev || {})[activeClass] || []).filter((p) => p.mentorId !== mentorId && p.menteeId !== menteeId)),
            newPair,
          ],
        }));

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) => {
            if (s.id === mentorId) return { ...s, deskSlot: slotA, team: colNum };
            if (s.id === menteeId) return { ...s, deskSlot: slotB, team: colNum };
            if (s.deskSlot === slotA || s.deskSlot === slotB) return { ...s, deskSlot: '' };
            return s;
          }),
        }));

        showToast(`Đã ghép đôi và xếp chỗ ngồi chung tại Dãy ${colNum} - Bàn ${deskNum}!`);
      };

      const handleRemovePeerPair = (pairId) => {
        setPeerPairsByClass((prev) => ({
          ...(prev || {}),
          [activeClass]: ((prev || {})[activeClass] || []).filter((p) => p.id !== pairId),
        }));
        showToast('Đã xóa cặp Đôi bạn cùng tiến.');
      };

      const buildSmartZaloTemplate = (stu, templateId) => {
        if (!stu) return '';
        const wInfo = weekDatesMap[selectedWeek] || {};
        const weekRangeTxt = wInfo.startSunday
          ? `(CN ${formatVNShortDate(wInfo.startSunday)} - T7 ${formatVNShortDate(wInfo.endSaturday)})`
          : '';
        const weekCond = calculateWeeklyConductScore(stu.id, selectedWeek);
        const monthCond = calculateMonthlyConductSummary(stu.id, selectedReportMonth);
        const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);

        const weekViolations = [];
        DAYS_OF_WEEK.forEach((d) => {
          SESSIONS_OF_DAY.forEach((ses) => {
            const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, selectedWeek);
            codes.forEach((c) => {
              const t = attendanceTypes.find((x) => x.id === c);
              if (t && t.points < 0) weekViolations.push(`${d.label} (${ses.shortLabel}): ${t.label}`);
            });
          });
        });

        const subjLines = currentSubjects
          .map((subj) => {
            const avg =
              summaryPeriodMode === 'WHOLE_YEAR'
                ? getSubjectWholeYearAvg(stu.id, subj)
                : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? `${subj}: ${avg}` : null;
          })
          .filter(Boolean)
          .join(' | ');

        const missingItems = currentChecklists
          .filter((cl) => !cl.completedIds.includes(stu.id))
          .map((cl) => `${cl.title} (Hạn ${cl.dueDate})`);

        switch (templateId) {
          case 'MONTHLY_VIOLATION_REPORT': {
            const trk = getStudentContactTracking(stu.id, selectedReportMonth);
            const detailLines =
              monthCond.allMonthDetails.length > 0
                ? monthCond.allMonthDetails.map((d, idx) => `   + ${idx + 1}. ${d}`).join('\n')
                : '   + Không có vi phạm (Đi học đầy đủ, đúng giờ suốt tháng).';
            return [
              `[TÓM TẮT CHUYÊN CẦN & VI PHẠM THÁNG ${selectedReportMonth} - ${currentClassObj.name.toUpperCase()}]`,
              `Kính gửi Quý Phụ huynh em ${stu.name} (NS: ${stu.dob || '—'} • Nghề: ${stu.vocational || 'Văn hóa'}) - ${schoolName}:`,
              `1. Tổng hợp Tháng ${selectedReportMonth} (Tuần ${monthCond.weeks.join(', ')}): Nghỉ KP + Cúp tiết: ${monthCond.absentK} buổi (${monthCond.rawAbsentK || 0}K, ${monthCond.skipClassCT || 0}CT) | Nghỉ có phép: ${monthCond.absentP} buổi | Đi muộn: ${monthCond.lateM} lần | Lỗi nề nếp: ${monthCond.violationCount} lỗi.`,
              `2. Điểm rèn luyện TB Tháng ${selectedReportMonth}: ${monthCond.avgScore}/100đ (Xếp loại: ${monthCond.monthRank}).`,
              `3. Chi tiết đầy đủ các ngày vi phạm / nghỉ học trong tháng:`,
              detailLines,
              trk.isOver3Warning
                ? `🚨 CẢNH CÁO MỜI PHỤ HUYNH (Đã nhắn tin nhắc nhở quá 3 lần): Lý do giấy mời: ${trk.invitationReason || 'Vi phạm nề nếp/chuyên cần kéo dài nhiều lần trong tháng'}. Kính mời Quý Phụ huynh sắp xếp thời gian đến trường làm việc trực tiếp cùng GVCN ${teacherName}!`
                : monthCond.isExcessiveAbsence
                ? `⚠️ CẢNH BÁO: Em đã nghỉ học ${monthCond.totalAbsent} buổi trong Tháng ${selectedReportMonth}. Kính mong Gia đình phối hợp sát sao cùng GVCN ${teacherName} để đôn đốc em đi học chuyên cần, tránh nguy cơ bị cấm thi!`
                : `Trân trọng cảm ơn Quý Phụ huynh đã đồng hành cùng GVCN ${teacherName}!`,
            ].join('\n');
          }

          case 'WEEKLY_REPORT': {
            const lowSubjs = currentSubjects
              .map((subj) => {
                const scObj = getStudentSubjectScoreObj(stu.id, subj, semester);
                const avg = calculateSubjectAverage(scObj);
                const lowCols = ['tx1', 'tx2', 'tx3', 'tx4', 'gk', 'ck']
                  .filter((k) => scObj[k] !== '' && scObj[k] !== undefined && !isNaN(parseFloat(scObj[k])) && parseFloat(scObj[k]) < 6.0)
                  .map((k) => `${k.toUpperCase()}:${scObj[k]}`);
                if ((avg !== null && avg < 6.5) || lowCols.length > 0) {
                  return `${subj} (ĐTB: ${avg ?? '--'}${lowCols.length ? ', Cột điểm thấp: ' + lowCols.join(', ') : ''})`;
                }
                return null;
              })
              .filter(Boolean);
            const equivTxt = (weekCond.equivWarningLabels || []).join(' | ');
            return [

          case 'OLD_WEEKLY_REPORT_UNUSED':

          case 'VIOLATION_ALERT':

          case 'GRADE_REPORT':

          case 'CLASS_GROUP_BROADCAST':
          default: {
            const topStu = [...currentStudents]
              .sort((a, b) => (getStudentOverallGPA(b.id) ?? 0) - (getStudentOverallGPA(a.id) ?? 0))
              .slice(0, 3)
              .map((s) => s.name)
              .join(', ');
            return [
              `[BẢN TIN LỚP ${currentClassObj.name.toUpperCase()} - TUẦN ${selectedWeek} ${weekRangeTxt}]`,

      useEffect(() => {
        const stu = currentStudents.find((s) => s.id === selectedCommStudentId) || currentStudents[0];
        if (stu) setCustomZaloMessage(buildSmartZaloTemplate(stu, selectedTemplateId));
      }, [selectedCommStudentId, selectedTemplateId, selectedWeek, selectedReportMonth, semester, activeClass]);

      const cleanPhoneForLink = (phone) => (phone || '').replace(/[^0-9]/g, '');

      const handleOpenZaloDirect = (stu, customText = null) => {
        const text = customText || buildSmartZaloTemplate(stu, 'WEEKLY_REPORT');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
        const phone = cleanPhoneForLink(stu.parentPhone);

          window.open(`https://zalo.me/${phone}`, '_blank', 'noopener,noreferrer');
          showToast(`Đã copy nội dung và mở thẳng Zalo Phụ huynh em ${stu.name} (${phone})!`);
        } else {
          showToast(`Đã copy tin nhắn của em ${stu.name} (Chưa có SĐT PH để mở link Zalo).`);
        }
