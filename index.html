      d.setDate(d.getDate() - day);

      return d;
    };

    const formatISODate = (dateObj) => {

      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const formatVNShortDate = (isoStr) => {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      return `${parts[2]}/${parts[1]}`;
    };

    const formatVNFullDate = (isoStr) => {
      if (!isoStr) return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

    // Khởi tạo 35 tuần chuẩn HKI (1-18) và HKII (19-35) sao cho Tuần 10 khớp ngay với tuần thực tế hiện tại
    const buildDefaultWeekDates = (yearStr = '2026 - 2027') => {
      const currentSunday = getSundayOfDate(new Date());
      // Lùi 9 tuần để Tuần 10 nằm đúng tuần hiện tại (08/11/2026 - 14/11/2026)
      const week1Sunday = new Date(currentSunday);
      week1Sunday.setDate(currentSunday.getDate() - 9 * 7);

      const map = {};
      for (let w = 1; w <= 35; w++) {
        const extraWeeks = w >= 19 ? 2 : 0;
        const sun = new Date(week1Sunday);
        sun.setDate(week1Sunday.getDate() + (w - 1 + extraWeeks) * 7);
        const sat = new Date(sun);
        sat.setDate(sun.getDate() + 6);
        map[w] = {
          semester: w <= 18 ? 'Học kỳ 1' : 'Học kỳ 2',
          startSunday: formatISODate(sun),
          endSaturday: formatISODate(sat),
        };
      }
      return map;
    };

    // ============================================================================
    // CƠ CHẾ LƯU TRỮ KÉP DUNG LƯỢNG LỚN (INDEXED-DB > 500MB + LOCALSTORAGE)
    // ============================================================================
    const STORAGE_KEY = 'gv_student_app_v9_week10_pro';
    const IDB_NAME = 'GV_StudentManagement_LargeDB_v5';
    const IDB_STORE = 'workspace_store';
    const IDB_RECORD_KEY = 'primary_state';

    const loadSavedStateSync = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && parsed.archiveByYear) return parsed;
      } catch (e) {}
      return null;
    };

    const openLargeDatabase = () => {
      return new Promise((resolve) => {
        if (typeof window === 'undefined' || !window.indexedDB) return resolve(null);
        const request = window.indexedDB.open(IDB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      });
    };

    const saveToLargeIndexedDB = async (payload) => {
      try {
        const db = await openLargeDatabase();
        if (!db) return false;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(payload, IDB_RECORD_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    };

    const loadFromLargeIndexedDB = async () => {
      try {
        const db = await openLargeDatabase();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(IDB_RECORD_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    };

    const calculateSubjectAverage = (scoreObj) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const ck = parseFloat(scoreObj.ck);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      const hasCK = !isNaN(ck) && ck >= 0 && ck <= 10;

      if (txValues.length === 0 && !hasGK && !hasCK) return null;

      let totalScore = txValues.reduce((a, b) => a + b, 0);
      let totalWeight = txValues.length;
      if (hasGK) { totalScore += gk * 2; totalWeight += 2; }
      if (hasCK) { totalScore += ck * 3; totalWeight += 3; }

      if (totalWeight === 0) return null;
      return Number((totalScore / totalWeight).toFixed(1));
    };

    const calculateFinalExamForecast = (scoreObj, targetAvg = 8.0) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      if (txValues.length === 0 && !hasGK) return null;

      let currentSum = txValues.reduce((a, b) => a + b, 0) + (hasGK ? gk * 2 : 0);
      let currentWeight = txValues.length + (hasGK ? 2 : 0);
      const totalWeightWithCK = currentWeight + 3;
      const neededCK = (targetAvg * totalWeightWithCK - currentSum) / 3;
      return Number(neededCK.toFixed(1));
    };

      const initialSaved = useMemo(() => loadSavedStateSync(), []);

      const [liveNow, setLiveNow] = useState(() => new Date());
      useEffect(() => {
        const timer = setInterval(() => setLiveNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const liveTimeText = liveNow.toLocaleTimeString('vi-VN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
      const liveDateText = liveNow.toLocaleDateString('vi-VN', {
        day: '2-digit',
        month: '2-digit',

      const currentMonthNumber = liveNow.getMonth() + 1;

      const [schoolName, setSchoolName] = useState(
        () => initialSaved?.schoolName || 'Trường Trung Cấp & THPT Nhật Hạ'
      );
      const [semester, setSemester] = useState(() => initialSaved?.semester || 'Học kỳ 1');
      const [teacherName, setTeacherName] = useState(
        () => initialSaved?.teacherName || 'Dương Anh Tuấn Anh'

      const [mainSubject, setMainSubject] = useState(() => initialSaved?.mainSubject || 'Hóa học');

      const [schoolYear, setSchoolYear] = useState(() => initialSaved?.schoolYear || '2026 - 2027');
      const [archiveByYear, setArchiveByYear] = useState(

          const parts = (str || '').split(':').map((x) => parseInt(x, 10));
          if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            return parts[0] * 60 + parts[1];
          }
          return fallbackH * 60 + fallbackM;
        };
        const fmtHM = (totalMinutes) => {
          const normalized = ((totalMinutes % 1440) + 1440) % 1440;
          const h = String(Math.floor(normalized / 60)).padStart(2, '0');
          const m = String(normalized % 60).padStart(2, '0');
          return `${h}:${m}`;
        };

        const dur = Math.max(15, Number(autoTimeGenerator.durationMin) || 45);
        const sBreak = Math.max(0, Number(autoTimeGenerator.shortBreakMin) || 5);
        const lBreak = Math.max(0, Number(autoTimeGenerator.longBreakMin) || 15);
        const afterP = Number(autoTimeGenerator.longBreakAfterPeriod) || 2;

        const nextMap = {};
        let curMorning = parseHM(autoTimeGenerator.morningStart, 7, 0);
        for (let p = 1; p <= 5; p++) {
          const endM = curMorning + dur;
          nextMap[`S${p}`] = `${fmtHM(curMorning)} - ${fmtHM(endM)}`;
          curMorning = endM + (p === afterP ? lBreak : sBreak);
        }

        let curAfternoon = parseHM(autoTimeGenerator.afternoonStart, 13, 30);
        for (let p = 1; p <= 5; p++) {
          const endA = curAfternoon + dur;
          nextMap[`C${p}`] = `${fmtHM(curAfternoon)} - ${fmtHM(endA)}`;

            T6: cleaned[4 + offset] || '',
            T7: cleaned[5 + offset] || '',
            CN: cleaned[6 + offset] || '',
          };
        });

        setTimetablesByClass((prev) => ({
          ...(prev || {}),
          [activeClass]: {
            ...((prev || {})[activeClass] || {}),
            [selectedWeek]: nextWeekObj,
          },
        }));
        setTkbPasteText('');
        setTkbImportModalOpen(false);
        showToast(`Đã tải Thời khóa biểu Tuần ${selectedWeek} (Thứ 2 → Chủ nhật) thành công!`);
      };

      const handleUploadTkbFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          handleProcessTkbPasteOrCSV(evt.target.result || '');
        };
        reader.readAsText(file);
      };

      const [weekScheduleModalOpen, setWeekScheduleModalOpen] = useState(false);
      const [dateFinderInput, setDateFinderInput] = useState(() => formatISODate(new Date()));
      const [showViolationChartInTab2, setShowViolationChartInTab2] = useState(true);
      const [newEventForm, setNewEventForm] = useState({
        title: '',
        targetDate: '2026-11-20',
        category: 'Công tác GVCN',
        assignee: 'Cả lớp',
      });
      const [newCoachingForm, setNewCoachingForm] = useState({
        studentId: '',
        groupType: 'Phụ đạo củng cố',
        subject: mainSubject,
        schedule: 'Sáng Thứ 7',
        targetScore: 'ĐTB ≥ 6.5',
        progressNote: '',
      });

      // Đồng bộ toàn bộ 35 tuần tự động lấy Tuần đang chọn làm mốc
      const handleCascadeAll35WeeksFromCurrent = (anchorWeekNum, pickedDateISO) => {
        if (!pickedDateISO) return;
        const parsed = new Date(pickedDateISO + 'T00:00:00');
        if (isNaN(parsed.getTime())) return;
        const anchorSunday = getSundayOfDate(parsed);

        const newMap = {};
        for (let w = 1; w <= 35; w++) {
          const diffWeeks = w - anchorWeekNum;
          const sun = new Date(anchorSunday);
          sun.setDate(anchorSunday.getDate() + diffWeeks * 7);
          const sat = new Date(sun);
          sat.setDate(sun.getDate() + 6);
          newMap[w] = {
            semester: w <= 18 ? 'Học kỳ 1' : 'Học kỳ 2',
            startSunday: formatISODate(sun),
            endSaturday: formatISODate(sat),
          };
        }
        updateYearField('weekDates', newMap);
        showToast(
          `Đã lấy Tuần ${anchorWeekNum} (CN ${formatVNFullDate(formatISODate(anchorSunday))}) làm mốc và tự động cập nhật lịch cả 35 tuần!`
        );
      };

      // Tìm nhanh tuần học chứa một ngày bất kỳ
      const handleFindAndJumpToWeekByDate = (isoDateStr) => {
        if (!isoDateStr) return;
        const targetSunISO = formatISODate(getSundayOfDate(new Date(isoDateStr + 'T00:00:00')));
        let foundWeek = null;
        for (let w = 1; w <= 35; w++) {
          if (weekDatesMap[w]?.startSunday === targetSunISO) {
            foundWeek = w;
            break;
          }
        }
        if (foundWeek) {
          handleSelectWeek(foundWeek);
          showToast(`Ngày ${formatVNFullDate(isoDateStr)} thuộc Tuần ${foundWeek} (CN → T7)!`);
        } else {
          handleAdjustWeekByAnyDate(selectedWeek, isoDateStr);
        }
      };

      useEffect(() => {
        if (currentStudents.length > 0) {
          const firstId = currentStudents[0].id;
          if (!selectedCommStudentId || !currentStudents.some((s) => s.id === selectedCommStudentId)) {
            setSelectedCommStudentId(firstId);
          }
          if (!newLeaveForm.studentId) setNewLeaveForm((p) => ({ ...p, studentId: firstId }));
          if (!newParentLogForm.studentId) setNewParentLogForm((p) => ({ ...p, studentId: firstId }));
          if (!newCounselingForm.studentId) setNewCounselingForm((p) => ({ ...p, studentId: firstId }));
          if (!newEquipmentForm.studentId) setNewEquipmentForm((p) => ({ ...p, studentId: firstId }));
          if (!newCoachingForm.studentId) setNewCoachingForm((p) => ({ ...p, studentId: firstId }));
        }
      }, [currentStudents, activeClass]);

      const isStudentTakingVocational = (stu) => {
        if (typeof stu.hasVocational === 'boolean') return stu.hasVocational;
        return stu.vocational && stu.vocational !== 'Không học nghề';
      };

      const rosterStudents = useMemo(() => {
        if (rosterFilterMode === 'VOCATIONAL_ONLY') {
          return currentStudents.filter((s) => isStudentTakingVocational(s));
        }
        return currentStudents;
      }, [currentStudents, rosterFilterMode]);

      const filteredStudents = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return rosterStudents;
        return rosterStudents.filter(
          (s) =>
            s.name.toLowerCase().includes(q) ||
            (s.moetId || s.id || '').toLowerCase().includes(q) ||
            (s.status || '').toLowerCase().includes(q) ||
            (s.vocational || '').toLowerCase().includes(q) ||
            (s.role || '').toLowerCase().includes(q) ||
            (s.studentPhone || '').includes(q) ||
            (s.parentPhone || '').includes(q) ||
            (s.specialNote || '').toLowerCase().includes(q)
        );
      }, [rosterStudents, searchQuery]);

      // ============================================================================
      // TÍNH TOÁN CHUYÊN CẦN 7 NGÀY (CN -> T7 | SÁNG - CHIỀU) & BIỂU ĐỒ VI PHẠM
      // ============================================================================
      const getStudentWeekRecord = (stuId, weekNum = selectedWeek) => {
        return attendance[activeClass]?.[weekNum]?.[stuId] || {};
      };

      const getStudentDaySessionCodes = (stuId, dayKey, sessionKey = 'S', weekNum = selectedWeek) => {
        const rec = getStudentWeekRecord(stuId, weekNum);
        const sessionField = `${dayKey}_${sessionKey}`;
        if (Array.isArray(rec[sessionField])) return rec[sessionField];
        if (sessionKey === 'S' && Array.isArray(rec[dayKey])) return rec[dayKey];
        return [];
      };

      const calculateWeeklyConductScore = (stuId, weekNum = selectedWeek) => {
        let score = 100;
        let totalAbsentP = 0;
        let totalAbsentK = 0;
        let totalLate = 0;
        let totalPlus = 0;
        let totalViolations = 0;

        DAYS_OF_WEEK.forEach((d) => {
          SESSIONS_OF_DAY.forEach((ses) => {
            const codes = getStudentDaySessionCodes(stuId, d.key, ses.key, weekNum);
            codes.forEach((code) => {
              const typeObj = attendanceTypes.find((t) => t.id === code);
              if (typeObj) {
                score += Number(typeObj.points || 0);
                if (code === 'P') totalAbsentP += 1;
                if (code === 'K') totalAbsentK += 1;
                if (code === 'M') totalLate += 1;
                if (typeObj.points > 0) totalPlus += 1;
                if (typeObj.points < 0 && code !== 'P') totalViolations += 1;
              }
            });
          });
        });

        const clamped = Math.max(0, Math.min(120, score));
        let rank = 'Tốt';
        if (clamped < 65 || totalAbsentK >= 2) rank = 'Chưa đạt';
        else if (clamped < 80) rank = 'Đạt';
        else if (clamped < 90) rank = 'Khá';

        return {
          score: clamped,
          rank,
          totalAbsentP,
          totalAbsentK,
          totalLate,
          totalPlus,
          totalViolations,
        };
      };

      const calculateYearAttendanceSummary = (stuId) => {
        const classAtt = attendance[activeClass] || {};
        let absentP = 0;
        let absentK = 0;
        let late = 0;
        let plusCount = 0;
        let totalViolations = 0;
        let totalScoreSum = 0;
        let trackedWeeks = 0;

        Object.keys(classAtt).forEach((wKey) => {
          const wSummary = calculateWeeklyConductScore(stuId, Number(wKey));
          absentP += wSummary.totalAbsentP;
          absentK += wSummary.totalAbsentK;
          late += wSummary.totalLate;
          plusCount += wSummary.totalPlus;
          totalViolations += wSummary.totalViolations;
          totalScoreSum += wSummary.score;
          trackedWeeks += 1;
        });

        const avgConductScore = trackedWeeks > 0 ? Math.round(totalScoreSum / trackedWeeks) : 100;
        let yearConductRank = 'Tốt';
        if (avgConductScore < 65 || absentK >= 5) yearConductRank = 'Chưa đạt';
        else if (avgConductScore < 80) yearConductRank = 'Đạt';
        else if (avgConductScore < 90) yearConductRank = 'Khá';

        return {
          absentP,
          absentK,
          late,
          plusCount,
          totalViolations,
          avgConductScore,
          yearConductRank,
        };
      };

      const violationAnalytics = useMemo(() => {
        const dayCounts = { CN: 0, T2: 0, T3: 0, T4: 0, T5: 0, T6: 0, T7: 0 };
        const typeCounts = {};
        attendanceTypes.forEach((t) => {
          if (t.points < 0) typeCounts[t.id] = 0;
        });

        const studentStats = currentStudents.map((stu) => {
          if (violationChartScope === 'WEEK') {
            const w = calculateWeeklyConductScore(stu.id, selectedWeek);
            const details = [];
            DAYS_OF_WEEK.forEach((d) => {
              SESSIONS_OF_DAY.forEach((ses) => {
                const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, selectedWeek);
                codes.forEach((c) => {
                  const t = attendanceTypes.find((x) => x.id === c);
                  if (t && t.points < 0) {
                    dayCounts[d.key] = (dayCounts[d.key] || 0) + 1;
                    typeCounts[c] = (typeCounts[c] || 0) + 1;
                    details.push(`${d.label} (${ses.shortLabel}): ${t.label}`);
                  }
                });
              });
            });
            return {
              student: stu,
              violationCount: w.totalViolations + w.totalAbsentP,
              unexcusedK: w.totalAbsentK,
              lateM: w.totalLate,
              conductScore: w.score,
              details,
            };
          } else {
            const y = calculateYearAttendanceSummary(stu.id);
            const classAtt = attendance[activeClass] || {};
            const details = [];
            Object.keys(classAtt).forEach((wKey) => {
              DAYS_OF_WEEK.forEach((d) => {
                SESSIONS_OF_DAY.forEach((ses) => {
                  const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, Number(wKey));
                  codes.forEach((c) => {
                    const t = attendanceTypes.find((x) => x.id === c);
                    if (t && t.points < 0) {
                      dayCounts[d.key] = (dayCounts[d.key] || 0) + 1;
                      typeCounts[c] = (typeCounts[c] || 0) + 1;
                      if (details.length < 6) {
                        details.push(`T${wKey}-${d.key}(${ses.key}): ${t.label}`);
                      }
                    }
                  });
                });
              });
            });
            return {
              student: stu,
              violationCount: y.totalViolations + y.absentP,
              unexcusedK: y.absentK,
              lateM: y.late,
              conductScore: y.avgConductScore,
              details,
            };
          }
        });

        const rankedStudents = studentStats
          .filter((item) => item.violationCount > 0 || item.conductScore < 98)
          .sort((a, b) => b.violationCount - a.violationCount || a.conductScore - b.conductScore);

        const maxDayCount = Math.max(1, ...Object.values(dayCounts));
        const maxViolationCount = Math.max(1, ...(rankedStudents.map((r) => r.violationCount)));
        return { rankedStudents, dayCounts, typeCounts, maxDayCount, maxViolationCount };
      }, [currentStudents, attendance, activeClass, selectedWeek, violationChartScope, attendanceTypes]);

      // Component dùng chung: Biểu Đồ Đánh Giá Học Sinh Vi Phạm Nhiều & Liên Hệ Phụ Huynh Tức Thì

            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#ece9df] pb-2.5">
              <div className="flex items-center gap-2">
                <BarChart className="w-4 h-4 text-[#8f5c38]" />

                  </h3>
                  <p className="text-[11px] text-slate-500">

                  </p>
                </div>

              <div className="flex gap-1.5">
                <button

                    violationChartScope === 'WEEK'

                >
                  Tuần {selectedWeek} (CN → T7)
                </button>
                <button

                >

            </div>

            {violationAnalytics.rankedStudents.length === 0 ? (

                <span className="px-2.5 py-1 bg-white rounded-lg border border-emerald-300 font-bold text-emerald-800">100% Tốt</span>
              </div>
            ) : (
              <div className="space-y-2.5">
                {violationAnalytics.rankedStudents.map((item, idx) => {

                  return (
                    <div
                      key={item.student.id}
                      className={`p-3 rounded-xl border transition-colors ${

                          ? 'bg-amber-50/50 border-amber-300'

                      }`}
                    >
                      <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-3">
                        <div className="flex-1 space-y-1.5">
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-2">
                              <span

                            title="In Bản Cam Kết Khắc Phục Vi Phạm (PDF A4) cho học sinh và phụ huynh ký"
                          >
                            <Printer className="w-3.5 h-3.5" />
                            In Bản Cam Kết (PDF)
                          </button>

                          <button
                            type="button"
                            onClick={() => triggerPrintPDF(item.student, 'INVITATION_SLIP')}
                            className="px-2.5 py-1.5 bg-[#efeee6] hover:bg-[#e2dfd5] text-[#183c42] border border-[#d6d2c4] rounded-lg font-semibold"
                            title="In Giấy Mời Phụ Huynh (PDF A4 có phần phiếu phản hồi rọc rời)"
                          >
                            In Giấy Mời PH
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Cột Phải (4 cột): Biểu đồ mật độ lỗi theo Thứ (CN -> T7) & Thống kê theo loại lỗi */}
          <div className="lg:col-span-4 bg-white border border-[#e2dfd5] rounded-xl p-4 space-y-4 flex flex-col justify-between">
            <div>
              <div className="font-bold text-sm text-[#183c42] border-b border-[#ece9df] pb-2 mb-3 flex items-center justify-between">
                <span>Mật Độ Lỗi Theo Thứ (CN → T7)</span>
                <span className="text-[11px] font-semibold text-[#8f5c38]">
                  {violationChartScope === 'WEEK' ? `Tuần ${selectedWeek}` : 'Cả năm'}
                </span>
              </div>
              <div className="grid grid-cols-7 gap-1.5 items-end h-36 pt-5 px-2 bg-[#faf9f5] rounded-lg border border-[#ece9df]">
                {currentWeekDaysWithDates.map((d) => {
                  const cnt = violationAnalytics.dayCounts[d.key] || 0;
                  const heightPct = cnt === 0 ? 8 : Math.max(18, Math.round((cnt / violationAnalytics.maxDayCount) * 100));
                  return (
                    <div key={d.key} className="flex flex-col items-center justify-end h-full pb-2">

                      </span>
                      <div
                        className={`w-full max-w-[28px] rounded-t transition-all ${

                        }`}
                        style={{ height: `${heightPct}%` }}
                      />
                      <span className="text-[11px] font-bold text-[#183c42] mt-1.5">{d.key}</span>
                      <span className="text-[9px] text-slate-500">{d.vnDate}</span>
                    </div>

                })}
              </div>
            </div>

            {/* Thống kê tỷ trọng từng loại vi phạm */}
            <div className="p-3 rounded-xl bg-[#faf9f5] border border-[#ece9df] space-y-2">
              <div className="font-bold text-[#183c42] text-xs">Phân tích theo nhóm lỗi vi phạm:</div>
              <div className="grid grid-cols-2 gap-1.5">
                {attendanceTypes
                  .filter((t) => t.points < 0)
                  .map((t) => {
                    const count = violationAnalytics.typeCounts[t.id] || 0;
                    return (
                      <div
                        key={t.id}
                        className="px-2.5 py-1.5 rounded-lg bg-white border border-[#e2dfd5] flex items-center justify-between"
                      >
                        <span className="text-[11px] font-medium text-slate-700 truncate">

              </div>
            </div>

            <div className="p-3 rounded-xl bg-amber-50/70 border border-amber-200">
              <div className="font-bold text-[#8f5c38]">
                Góc Chúc Mừng Sinh Nhật Tháng {currentMonthNumber}:
              </div>
              <div className="mt-1 text-slate-800">
                {birthdayStudentsThisMonth.length === 0
                  ? `Không có học sinh sinh nhật trong tháng ${currentMonthNumber}.`
                  : birthdayStudentsThisMonth.map((s) => `${s.name} (${s.dob})`).join(' • ')}
              </div>
            </div>
          </div>
        </div>
      );

      const teamCompetitionStats = useMemo(() => {
        return [1, 2, 3, 4]
          .map((teamNum) => {
            const members = currentStudents.filter((s) => (Number(s.team) || 1) === teamNum);
            if (members.length === 0) {
              return { teamNum, count: 0, avgConduct: 100, plusCount: 0, violationCount: 0, totalPoints: 100 };
            }
            let sumConduct = 0;
            let plusCount = 0;
            let violationCount = 0;
            members.forEach((m) => {
              const c = calculateWeeklyConductScore(m.id, selectedWeek);
              sumConduct += c.score;
              plusCount += c.totalPlus;
              violationCount += c.totalViolations + c.totalAbsentK;
            });
            const avgConduct = Number((sumConduct / members.length).toFixed(1));
            return { teamNum, count: members.length, avgConduct, plusCount, violationCount, totalPoints: avgConduct };
          })
          .sort((a, b) => b.totalPoints - a.totalPoints);
      }, [currentStudents, attendance, activeClass, selectedWeek]);

      const getStudentSubjectScoreObj = (stuId, subj = selectedSubject, sem = semester) => {
        return (
          grades[activeClass]?.[sem]?.[subj]?.[stuId] || {
            tx1: '', tx2: '', tx3: '', tx4: '', gk: '', ck: '', comment: '',
          }
        );
      };

      const getSubjectWholeYearAvg = (stuId, subj) => {
        const hk1 = calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, 'Học kỳ 1'));
        const hk2 = calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, 'Học kỳ 2'));
        if (hk1 !== null && hk2 !== null) return Number(((hk1 + hk2 * 2) / 3).toFixed(1));
        if (hk1 !== null) return hk1;
        if (hk2 !== null) return hk2;
        return null;
      };

      const getStudentOverallGPA = (stuId, mode = summaryPeriodMode) => {
        const validScores = currentSubjects
          .map((subj) =>
            mode === 'WHOLE_YEAR'
              ? getSubjectWholeYearAvg(stuId, subj)
              : calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, semester))
          )
          .filter((v) => v !== null);
        if (validScores.length === 0) return null;
        return Number((validScores.reduce((a, b) => a + b, 0) / validScores.length).toFixed(1));
      };

      const classifyAcademicRank = (gpa) => {
        if (gpa === null) return 'Chưa đủ điểm';
        if (gpa >= 8.0) return 'Tốt (Giỏi)';
        if (gpa >= 6.5) return 'Khá';
        if (gpa >= 5.0) return 'Đạt';
        return 'Chưa đạt';
      };

      const getHonorTitle = (gpa, conductRank) => {
        if (gpa === null) return 'Chưa xét';
        if (gpa >= 9.0 && conductRank === 'Tốt') return 'Học sinh Xuất sắc';
        if (gpa >= 8.0 && conductRank === 'Tốt') return 'Học sinh Giỏi';
        if (gpa >= 6.5 && (conductRank === 'Tốt' || conductRank === 'Khá')) return 'Học sinh Tiên tiến';
        return 'Hoàn thành';
      };

      const buildSmartZaloTemplate = (stu, templateId) => {
        if (!stu) return '';
        const wInfo = weekDatesMap[selectedWeek] || {};
        const weekRangeTxt = wInfo.startSunday
          ? `(CN ${formatVNShortDate(wInfo.startSunday)} - T7 ${formatVNShortDate(wInfo.endSaturday)})`
          : '';
        const weekCond = calculateWeeklyConductScore(stu.id, selectedWeek);
        const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);

        const weekViolations = [];
        DAYS_OF_WEEK.forEach((d) => {
          SESSIONS_OF_DAY.forEach((ses) => {
            const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, selectedWeek);
            codes.forEach((c) => {
              const t = attendanceTypes.find((x) => x.id === c);
              if (t && t.points < 0) weekViolations.push(`${d.label} (${ses.shortLabel}): ${t.label}`);
            });
          });
        });

        const subjLines = currentSubjects
          .map((subj) => {
            const avg =
              summaryPeriodMode === 'WHOLE_YEAR'
                ? getSubjectWholeYearAvg(stu.id, subj)
                : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? `${subj}: ${avg}` : null;
          })
          .filter(Boolean)
          .join(' | ');

        const missingItems = currentChecklists
          .filter((cl) => !cl.completedIds.includes(stu.id))
          .map((cl) => `${cl.title} (Hạn ${cl.dueDate})`);

        switch (templateId) {
          case 'WEEKLY_REPORT':
            return [
              `Kính gửi Quý Phụ huynh em ${stu.name} (${currentClassObj.name} - ${schoolName}):`,
              `Thầy/Cô xin gửi báo cáo Tuần ${selectedWeek} ${weekRangeTxt}:`,
              `- Chuyên cần & Nề nếp: ${weekCond.score}/100đ (${weekCond.rank}). ${
                weekViolations.length === 0
                  ? 'Em đi học đầy đủ, đúng giờ, chấp hành tốt nội quy.'
                  : 'Cần lưu ý: ' + weekViolations.join('; ') + '.'
              }`,
              `- Thái độ học tập: ${stu.attitude}.`,
              `- ĐTB chung hiện tại: ${gpa ?? 'Đang cập nhật'}.`,
              `Trân trọng cảm ơn Gia đình đã phối hợp cùng GVCN ${teacherName}!`,
            ].join('\n');

          case 'VIOLATION_ALERT':
            return [
              `[THÔNG BÁO PHỐI HỢP NỀ NẾP - ${currentClassObj.name}]`,
              `Kính gửi Phụ huynh em ${stu.name} (SĐT PH: ${stu.parentPhone || '--'}):`,
              `Trong Tuần ${selectedWeek} ${weekRangeTxt}, nhà trường ghi nhận em có vi phạm: ${
                weekViolations.length > 0 ? weekViolations.join('; ') : 'Chưa phát sinh lỗi mới'
              }.`,
              `Điểm thi đua tuần hiện còn ${weekCond.score}/100đ. Rất mong Quý Phụ huynh quan tâm nhắc nhở, đôn đốc em khắc phục ngay trong tuần tới.`,
              `Trân trọng - GVCN ${teacherName}.`,
            ].join('\n');

          case 'GRADE_REPORT':
            return [
              `[BÁO CÁO KẾT QUẢ ĐIỂM SỐ - ${semester.toUpperCase()}]`,
              `Kính gửi Phụ huynh em ${stu.name} (${currentClassObj.name}):`,
              `- Kết quả các môn: ${subjLines || 'Đang cập nhật điểm kiểm tra'}.`,
              `- Điểm TB chung: ${gpa ?? '--'} (Xếp loại: ${classifyAcademicRank(gpa)}).`,
              `- Nhận xét GV: ${stu.gvcnComment || buildSmartPedagogicalComment(stu, 'ENCOURAGING', 'GVCN_YEAR')}`,
              `Trân trọng - GV ${teacherName}.`,
            ].join('\n');

          case 'MISSING_TASKS':
            return [
              `[NHẮC NHỞ HOÀN THÀNH BÀI TẬP / HỒ SƠ - ${currentClassObj.name}]`,
              `Kính gửi Phụ huynh em ${stu.name}:`,
              missingItems.length > 0
                ? `Hiện tại em còn chưa hoàn thành các mục sau: ${missingItems.join('; ')}. Kính nhờ Gia đình nhắc em nộp đúng hạn.`
                : `Chúc mừng Gia đình, em ${stu.name} đã hoàn thành 100% các bài tập và hồ sơ lớp!`,
              `Trân trọng - GV ${teacherName}.`,
            ].join('\n');

          case 'PRAISE_COMMEND':
            return [
              `[THƯ KHEN NGỢI & BIỂU DƯƠNG HỌC SINH - ${schoolName.toUpperCase()}]`,
              `Thầy/Cô xin chúc mừng Gia đình và em ${stu.name} (${currentClassObj.name}) đã đạt thành tích nổi bật trong Tuần ${selectedWeek}: Điểm nề nếp ${weekCond.score}đ, thái độ ${stu.attitude.toLowerCase()}, ĐTB ${gpa ?? '--'}.`,
              `Mong em tiếp tục phát huy tinh thần học tập tích cực! - GV ${teacherName}.`,
            ].join('\n');

          case 'CLASS_GROUP_BROADCAST':
          default: {
            const topStu = [...currentStudents]
              .sort((a, b) => (getStudentOverallGPA(b.id) ?? 0) - (getStudentOverallGPA(a.id) ?? 0))
              .slice(0, 3)
              .map((s) => s.name)
              .join(', ');
            return [
              `[BẢN TIN LỚP ${currentClassObj.name.toUpperCase()} - TUẦN ${selectedWeek} ${weekRangeTxt}]`,
              `Kính gửi Quý Phụ huynh ${currentClassObj.name}:`,
              `1. Sĩ số lớp: ${currentStudents.length} HS (${semester} - Năm học ${schoolYear}).`,
              `2. Tuyên dương các em tiêu biểu tuần qua: ${topStu || 'Cả lớp'}.`,
              `3. Lịch trực nhật tuần tới: ${Object.entries(currentDutyRoster)
                .map(([k, v]) => `${k}: ${v}`)
                .join(' | ')}.`,
              `Kính chúc Quý Phụ huynh và các em một tuần mới mạnh khỏe, học tập hiệu quả! - GVCN ${teacherName}.`,
            ].join('\n');
          }
        }
      };

      useEffect(() => {
        const stu = currentStudents.find((s) => s.id === selectedCommStudentId) || currentStudents[0];
        if (stu) setCustomZaloMessage(buildSmartZaloTemplate(stu, selectedTemplateId));
      }, [selectedCommStudentId, selectedTemplateId, selectedWeek, semester, activeClass]);

      const cleanPhoneForLink = (phone) => (phone || '').replace(/[^0-9]/g, '');

      const handleOpenZaloDirect = (stu, customText = null) => {
        const text = customText || buildSmartZaloTemplate(stu, 'WEEKLY_REPORT');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
        const phone = cleanPhoneForLink(stu.parentPhone);
        if (phone) {
          window.open(`https://zalo.me/${phone}`, '_blank', 'noopener,noreferrer');
          showToast(`Đã copy nội dung và mở thẳng Zalo Phụ huynh em ${stu.name} (${phone})!`);
        } else {
          showToast(`Đã copy tin nhắn của em ${stu.name} (Chưa có SĐT PH để mở link Zalo).`);
        }
      };

      // ============================================================================
      // THAO TÁC CẬP NHẬT DỮ LIỆU
      // ============================================================================
      const handleUpdateStudentFieldInline = (stuId, field, value) => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) =>
            s.id === stuId ? { ...s, [field]: value } : s
          ),
        }));
      };

      const handleSaveStudentModal = (e) => {
        e.preventDefault();
        if (!studentModal || !studentModal.name.trim()) return;
        const generatedInternalId = studentModal.id?.trim() || `HS${Date.now().toString().slice(-4)}`;
        const hasVoc =
          typeof studentModal.hasVocational === 'boolean'
            ? studentModal.hasVocational
            : studentModal.vocational !== 'Không học nghề';
        const stuData = {
          id: generatedInternalId,
          moetId: (studentModal.moetId || generatedInternalId).trim(),
          name: studentModal.name.trim(),
          dob: studentModal.dob.trim() || '01/01/2011',
          gender: studentModal.gender || 'Nam',
          status: studentModal.status || 'Đang học',
          hasVocational: hasVoc,
          vocational: hasVoc ? (studentModal.vocational || 'Chưa phân nghề') : 'Không học nghề',
          tuitionExemption: hasVoc ? (studentModal.tuitionExemption || 'Không thuộc diện') : 'Không thuộc diện',
          tuitionDocStatus: hasVoc ? (studentModal.tuitionDocStatus || 'Chưa nộp') : 'Chỉ học Văn hóa',
          role: studentModal.role || 'Thành viên',
          attitude: studentModal.attitude || 'Tích cực',
          team: Number(studentModal.team) || 1,
          seat: Number(studentModal.seat) || currentStudents.length + 1,
          deskSlot: studentModal.deskSlot || '',
          studentPhone: (studentModal.studentPhone || '').trim(),
          parentPhone: (studentModal.parentPhone || '').trim(),
          specialNote: (studentModal.specialNote || '').trim(),
          gvcnComment: studentModal.gvcnComment || '',
        };

        if (studentModal.mode === 'ADD') {
          setStudentsByClass((prev) => ({
            ...prev,
            [activeClass]: [...(prev[activeClass] || []), stuData],
          }));
          showToast(`Đã thêm học sinh ${stuData.name} và tự động lưu.`);
        } else {
          setStudentsByClass((prev) => ({
            ...prev,
            [activeClass]: (prev[activeClass] || []).map((s) =>
              s.id === studentModal.originalId ? stuData : s
            ),
          }));
          showToast(`Đã cập nhật hồ sơ học sinh ${stuData.name}.`);
        }
        setStudentModal(null);
      };

      const handleDeleteStudent = (stuId) => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).filter((s) => s.id !== stuId),
        }));
        showToast('Đã xóa học sinh khỏi danh sách lớp.');
      };

      const handleAddClass = (e) => {
        e.preventDefault();
        const raw = newClassName.trim();
        if (!raw) return;
        const id = raw.replace(/\s+/g, '').toUpperCase();
        if (classes.some((c) => c.id === id)) {
          showToast('Mã lớp này đã tồn tại!');
          return;
        }
        setClasses((prev) => [...prev, { id, name: raw.startsWith('Lớp') ? raw : `Lớp ${raw}` }]);
        setStudentsByClass((prev) => ({ ...prev, [id]: [] }));
        setClassSubjects((prev) => ({
          ...prev,
          [id]: [mainSubject, 'Toán', 'Ngữ văn', 'Tiếng Anh'],
        }));
        setActiveClass(id);
        setNewClassName('');
        setNewClassModalOpen(false);
        showToast(`Đã tạo lớp mới: ${raw}`);
      };

      const handleDeleteClass = (classId) => {
        if (classes.length <= 1) {
          showToast('Cần giữ lại ít nhất 1 lớp học trong hệ thống.');
          return;
        }
        const nextClasses = classes.filter((c) => c.id !== classId);
        setClasses(nextClasses);
        if (activeClass === classId) setActiveClass(nextClasses[0].id);
        showToast(`Đã xóa lớp ${classId}.`);
      };

      const handleAddSubjectToClass = (e) => {
        e.preventDefault();
        const name = newSubjectName.trim();
        if (!name || currentSubjects.includes(name)) return;
        setClassSubjects((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), name],
        }));
        setSelectedSubject(name);
        setNewSubjectName('');
        showToast(`Đã thêm môn ${name} cho ${currentClassObj.name}.`);
      };

      const handleRemoveSubjectFromClass = (subjName) => {
        if (currentSubjects.length <= 1) return;
        const updated = currentSubjects.filter((s) => s !== subjName);
        setClassSubjects((prev) => ({ ...prev, [activeClass]: updated }));
        setSelectedSubject(updated[0]);
      };

      const handleGradeChange = (stuId, field, value) => {
        setGrades((prev) => {
          const classGrades = prev[activeClass] || {};
          const semGrades = classGrades[semester] || {};
          const subjGrades = semGrades[selectedSubject] || {};
          const stuGrades = subjGrades[stuId] || {
            tx1: '', tx2: '', tx3: '', tx4: '', gk: '', ck: '', comment: '',
          };
          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: {
                ...semGrades,
                [selectedSubject]: {
                  ...subjGrades,
                  [stuId]: { ...stuGrades, [field]: value },
                },
              },
            },
          };
        });
      };

      const toggleAttendanceCode = (stuId, dayKey, codeId, sessionKey = 'S', forceAddOnly = false) => {
        setAttendance((prev) => {
          const classAtt = prev[activeClass] || {};
          const weekAtt = classAtt[selectedWeek] || {};
          const stuAtt = { ...(weekAtt[stuId] || {}) };
          const sessionField = `${dayKey}_${sessionKey}`;

          let currentCodes = [];
          if (Array.isArray(stuAtt[sessionField])) {
            currentCodes = stuAtt[sessionField];
          } else if (sessionKey === 'S' && Array.isArray(stuAtt[dayKey])) {
            currentCodes = stuAtt[dayKey];
            delete stuAtt[dayKey];
          }

          const exists = currentCodes.includes(codeId);
          let nextCodes;
          if (forceAddOnly) {
            nextCodes = exists ? currentCodes : [...currentCodes, codeId];
          } else {
            nextCodes = exists
              ? currentCodes.filter((c) => c !== codeId)
              : [...currentCodes, codeId];
          }

          stuAtt[sessionField] = nextCodes;
          return {
            ...prev,
            [activeClass]: {
              ...classAtt,
              [selectedWeek]: {
                ...weekAtt,
                [stuId]: stuAtt,
              },
            },
          };
        });
      };

      const handleBatchTeamAttendance = () => {
        const teamMembers = currentStudents.filter((s) => (Number(s.team) || 1) === Number(batchTeam));
        if (teamMembers.length === 0) {
          showToast(`Tổ ${batchTeam} hiện chưa có học sinh.`);
          return;
        }
        teamMembers.forEach((stu) => {
          toggleAttendanceCode(stu.id, batchDayKey, batchCodeId, batchSessionKey, true);
        });
        const typeObj = attendanceTypes.find((t) => t.id === batchCodeId);
        showToast(
          `Đã áp dụng [${batchCodeId}] (${typeObj?.label || ''}) cho ${teamMembers.length} HS Tổ ${batchTeam} (${batchDayKey} - ${
            batchSessionKey === 'S' ? 'Sáng' : 'Chiều'
          })!`
        );
      };

      const handleApproveLeaveRequest = (reqId) => {
        const req = currentLeaveRequests.find((r) => r.id === reqId);
        if (!req) return;
        setLeaveRequestsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((r) =>
            r.id === reqId ? { ...r, status: 'APPROVED' } : r
          ),
        }));
        setAttendance((prev) => {
          const classAtt = prev[activeClass] || {};
          const weekAtt = classAtt[req.week] || {};
          const stuAtt = { ...(weekAtt[req.studentId] || {}) };
          const field = `${req.dayKey}_${req.sessionKey}`;
          const arr = Array.isArray(stuAtt[field]) ? [...stuAtt[field]] : [];
          if (!arr.includes('P')) arr.push('P');
          stuAtt[field] = arr;
          return {
            ...prev,
            [activeClass]: {
              ...classAtt,
              [req.week]: { ...weekAtt, [req.studentId]: stuAtt },
            },
          };
        });
        showToast('Đã duyệt đơn xin phép và tự động đồng bộ mã [P] vào Sổ Chuyên cần!');
      };

      const clearWeekAttendance = () => {
        setAttendance((prev) => ({
          ...prev,
          [activeClass]: { ...(prev[activeClass] || {}), [selectedWeek]: {} },
        }));
        showToast(`Đã đặt toàn bộ học sinh Tuần ${selectedWeek} về trạng thái Có mặt đủ (100đ).`);
      };

      const handleProcessExcelPaste = () => {
        const lines = excelPasteText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        if (excelImportMode === 'UPDATE_MOET_ID') {
          setStudentsByClass((prev) => {
            const list = [...(prev[activeClass] || [])];
            lines.forEach((line, idx) => {
              const cols = line.includes('\t') ? line.split('\t') : line.split(',');
              const clean = cols.map((c) => c.trim());
              if (list[idx]) {
                list[idx] = {
                  ...list[idx],
                  moetId: clean[0] || list[idx].moetId || list[idx].id,
                  status: clean[1] || list[idx].status || 'Đang học',
                  vocational: clean[2] || list[idx].vocational || 'Chưa phân nghề',
                };
              }
            });
            return { ...prev, [activeClass]: list };
          });
          setExcelPasteText('');
          setExcelImportModalOpen(false);
          showToast('Đã cập nhật Mã định danh Bộ / Tình trạng / Học nghề từ Excel!');
          return;
        }

        const added = lines.map((line, idx) => {
          const cols = line.includes('\t') ? line.split('\t') : line.split(',');
          const clean = cols.map((c) => c.trim());
          const hasMoetFirst =
            clean.length >= 2 && /^[0-9A-Za-z_-]{4,}$/.test(clean[0]) && !clean[0].includes(' ');
          const moetId = hasMoetFirst
            ? clean[0]
            : `072211${String(currentStudents.length + idx + 1).padStart(6, '0')}`;
          const offset = hasMoetFirst ? 1 : 0;

          return {
            id: `HS${Date.now().toString().slice(-4)}${idx}`,
            moetId,
            name: clean[0 + offset] || `Học sinh ${currentStudents.length + idx + 1}`,
            dob: clean[1 + offset] || '01/01/2011',
            gender: clean[2 + offset] || 'Nam',
            status: clean[3 + offset] || 'Đang học',
            vocational: clean[4 + offset] || 'Chưa phân nghề',
            tuitionExemption: 'Miễn 100% học phí nghề (NĐ 81)',
            tuitionDocStatus: 'Chưa nộp',
            role: clean[5 + offset] || 'Thành viên',
            attitude: clean[6 + offset] || 'Tích cực',
            team: ((currentStudents.length + idx) % 4) + 1,
            seat: currentStudents.length + idx + 1,
            deskSlot: '',
            studentPhone: clean[7 + offset] || '',
            parentPhone: clean[8 + offset] || '',
            specialNote: '',
            gvcnComment: '',
          };
        });

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), ...added],
        }));
        setExcelPasteText('');
        setExcelImportModalOpen(false);
        showToast(`Đã nhập ${added.length} học sinh vào ${currentClassObj.name}.`);
      };

      const handleProcessGradePaste = () => {
        const lines = gradePasteText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        setGrades((prev) => {
          const classGrades = { ...(prev[activeClass] || {}) };
          const semGrades = { ...(classGrades[semester] || {}) };
          const subjGrades = { ...(semGrades[selectedSubject] || {}) };

          currentStudents.forEach((stu, idx) => {
            if (!lines[idx]) return;
            const cols = lines[idx].includes('\t') ? lines[idx].split('\t') : lines[idx].split(',');
            const clean = cols.map((c) => c.trim());
            const existing = subjGrades[stu.id] || {};
            subjGrades[stu.id] = {
              ...existing,
              tx1: clean[0] ?? existing.tx1 ?? '',
              tx2: clean[1] ?? existing.tx2 ?? '',
              tx3: clean[2] ?? existing.tx3 ?? '',
              tx4: clean[3] ?? existing.tx4 ?? '',
              gk: clean[4] ?? existing.gk ?? '',
              ck: clean[5] ?? existing.ck ?? '',
              comment: clean[6] ?? existing.comment ?? '',
            };
          });

          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: { ...semGrades, [selectedSubject]: subjGrades },
            },
          };
        });

        setGradePasteText('');
        setGradePasteModalOpen(false);
        showToast(`Đã dán điểm môn ${selectedSubject} (${semester}).`);
      };

      const handleAssignStudentToSeatSlot = (slotKey, colNum, targetStudentId) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (!targetStudentId) return s.deskSlot === slotKey ? { ...s, deskSlot: '' } : s;
            if (s.id === targetStudentId) return { ...s, deskSlot: slotKey, team: colNum };
            if (s.deskSlot === slotKey) return { ...s, deskSlot: '' };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
      };

      const handleSwapTwoDeskSlots = (slotA, colA, slotB, colB) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (s.deskSlot === slotA) return { ...s, deskSlot: slotB, team: colB };
            if (s.deskSlot === slotB) return { ...s, deskSlot: slotA, team: colA };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
        showToast(`Đã đổi chỗ ngồi giữa vị trí ${slotA} và ${slotB}!`);
      };

      const handleAutoArrangeDesks = () => {
        const { cols, desksPerCol, seatsPerDesk } = seatLayoutConfig;
        const slots = [];
        for (let r = 1; r <= desksPerCol; r++) {
          for (let c = 1; c <= cols; c++) {
            for (let s = 1; s <= seatsPerDesk; s++) {
              slots.push({ slotKey: `${c}-${r}-${s}`, col: c });
            }
          }
        }
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((stu, idx) => {
            const target = slots[idx];
            return target
              ? { ...stu, deskSlot: target.slotKey, team: target.col }
              : { ...stu, deskSlot: '' };
          });
          return { ...prev, [activeClass]: list };
        });
        showToast('Đã tự động xếp học sinh vào các bàn học!');
      };

      const handleClearAllDesks = () => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) => ({ ...s, deskSlot: '' })),
        }));
        showToast('Đã làm trống sơ đồ bàn học.');
      };

      const buildSmartPedagogicalComment = (stu, tone = aiTone, targetMode = aiTargetMode) => {
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa =
          targetMode === 'GVCN_YEAR'
            ? getStudentOverallGPA(stu.id, summaryPeriodMode)
            : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester));

        const rolePart =
          stu.role && stu.role !== 'Thành viên'
            ? `Trên cương vị ${stu.role}, em luôn gương mẫu và trách nhiệm với tập thể. `
            : '';
        const vocPart =
          stu.vocational && stu.vocational !== 'Chưa phân nghề'
            ? `Định hướng nghề ${stu.vocational} nghiêm túc. `
            : '';

        let attitudePart =
          stu.attitude === 'Rất tích cực' || stu.attitude === 'Tích cực'
            ? 'Trong giờ học, em có thái độ học tập sôi nổi, hăng hái phát biểu xây dựng bài'
            : stu.attitude === 'Chăm chỉ' || stu.attitude === 'Khá chú ý'
            ? 'Em có ý thức học tập nghiêm túc, ghi chép bài đầy đủ và lắng nghe giảng bài'
            : 'Em cần tập trung chú ý hơn trên lớp và chủ động hoàn thành bài tập về nhà';

        const conductPart =
          yearCond.absentK === 0 && yearCond.late === 0
            ? `, chuyên cần đạt ${yearCond.avgConductScore}đ (${yearCond.yearConductRank}, đi học đúng giờ, đầy đủ). `
            : `, điểm chuyên cần đạt ${yearCond.avgConductScore}đ (vắng ${yearCond.absentP}P/${yearCond.absentK}K, đi muộn ${yearCond.late} lần - cần khắc phục để chuyên cần hơn). `;

        let scorePart = 'Đang cập nhật tiến độ điểm đánh giá định kỳ.';
        if (gpa !== null) {
          if (gpa >= 8.0) scorePart = `Kết quả học tập đạt mức Tốt (ĐTB ${gpa}), nắm vững kiến thức trọng tâm.`;
          else if (gpa >= 6.5) scorePart = `Kết quả học tập đạt mức Khá (ĐTB ${gpa}), nắm được kiến thức cơ bản.`;
          else if (gpa >= 5.0) scorePart = `Kết quả học tập đạt mức Đạt (ĐTB ${gpa}), cần rèn thêm kỹ năng giải bài tập.`;
          else scorePart = `Kết quả học tập hiện ở mức ${gpa}, gia đình và nhà trường cần phối hợp hỗ trợ em củng cố kiến thức.`;
        }

        if (tone === 'FORMAL_TT22') return `${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart}`;
        if (tone === 'DETAILED_PARENT') {
          return `Kính gửi Phụ huynh em ${stu.name}: ${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart} Rất mong gia đình tiếp tục đồng hành cùng nhà trường.`;
        }
        return `${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart} Chúc em luôn giữ vững sự tự tin và tiến bộ!`;
      };

          showToast(`Đã tạo nhận xét AI cho toàn bộ ${currentStudents.length} học sinh!`);

      const exportClassCSV = () => {
        const headers = [
          'Mã định danh Bộ', 'Họ và tên', 'Ngày sinh', 'Giới tính', 'Tình trạng', 'Học nghề',
          'Chế độ miễn giảm HP', 'Hồ sơ HP', 'Chức vụ', 'Thái độ học tập', 'Tổ',
          'SĐT Học sinh', 'SĐT Phụ huynh', 'Lưu ý đặc biệt',
          `Điểm Chuyên cần Tuần ${selectedWeek}`,
          ...currentSubjects.map((s) => `ĐTB ${s} (${semester})`),
          'ĐTB Chung', 'Nhận xét GVCN',
        ];
        const rows = currentStudents.map((stu) => {
          const cond = calculateWeeklyConductScore(stu.id);
          const subjScores = currentSubjects.map((subj) => {
            const avg = calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? avg : '';
          });
          const gpa = getStudentOverallGPA(stu.id, 'SEMESTER') ?? '';
          return [
            `'${stu.moetId || stu.id}`, `"${stu.name}"`, stu.dob, stu.gender,
            `"${stu.status || 'Đang học'}"`, `"${stu.vocational || 'Chưa phân nghề'}"`,
            `"${stu.tuitionExemption || ''}"`, `"${stu.tuitionDocStatus || ''}"`,
            `"${stu.role}"`, `"${stu.attitude}"`, stu.team,
            `'${stu.studentPhone}`, `'${stu.parentPhone}`,
            `"${(stu.specialNote || '').replace(/"/g, '""')}"`,
            cond.score, ...subjScores, gpa,
            `"${(stu.gvcnComment || '').replace(/"/g, '""')}"`,
          ].join(',');
        });
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SoQuanLyLop_${activeClass}_${schoolYear.replace(/\s+/g, '')}.csv`;
        a.click();
        showToast(`Đã xuất file Excel/CSV lớp ${activeClass}!`);
      };

      const promoteClassCode = (code) => code.replace(/^(\d+)/, (m) => String(Number(m) + 1));

        if (promoteClassesMode) {

            return { id: nextId, name: `Lớp ${nextId}` };

          const nextHomeroom = promoteClassCode(homeroomClassId);
          const nextStudents = {};

          classes.forEach((c) => {
            const nextId = promoteClassCode(c.id);
            nextStudents[nextId] = (studentsByClass[c.id] || []).map((s) => ({
              ...s,
              gvcnComment: '',

            nextSubjects[nextId] = [...(classSubjects[c.id] || [mainSubject])];

          setArchiveByYear((prev) => ({

              classSubjects: nextSubjects,
              weekDates: buildDefaultWeekDates(yName),
              studentsByClass: nextStudents,
              grades: {},
              attendance: {},
              checklistsByClass: {},
              leaveRequestsByClass: {},
              parentLogsByClass: {},
              classFundsByClass: {},
              dutyRosterByClass: {},
              lessonLogsByClass: {},
              counselingLogsByClass: {},
              equipmentLoansByClass: {},
            },
          }));
          setSchoolYear(yName);
          setActiveClass(nextClasses[0]?.id || '');
          showToast(`Đã tạo năm học ${yName} và tự động lên lớp!`);
        } else {
          setArchiveByYear((prev) => ({
            ...prev,
            [yName]: {
              ...buildDefaultArchive()['2026 - 2027'],
              weekDates: buildDefaultWeekDates(yName),
            },
          }));
          setSchoolYear(yName);
        }
        setYearModalOpen(false);
      };

      const handlePickRandomStudent = () => {
        if (currentStudents.length === 0) return;
        let pool = currentStudents.filter((s) => !pickedHistoryIds.includes(s.id));
        if (pool.length === 0) {
          pool = [...currentStudents];
          setPickedHistoryIds([]);
        }
        if (prioritizePassive) {
          const weighted = [];
          pool.forEach((s) => {
            const w = s.attitude === 'Còn thụ động' || s.attitude === 'Cần nhắc nhở' ? 3 : 1;
            for (let i = 0; i < w; i++) weighted.push(s);
          });
          const chosen = weighted[Math.floor(Math.random() * weighted.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        } else {
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        }
      };

      const handleGenerateBalancedGroups = () => {
        const count = Math.max(2, Math.min(8, Number(groupCount) || 4));
        const sorted = [...currentStudents].sort((a, b) => {
          const gpaA = calculateSubjectAverage(getStudentSubjectScoreObj(a.id, selectedSubject, semester)) ?? 6.5;
          const gpaB = calculateSubjectAverage(getStudentSubjectScoreObj(b.id, selectedSubject, semester)) ?? 6.5;
          return gpaB - gpaA;
        });
        const buckets = Array.from({ length: count }, (_, idx) => ({
          id: idx + 1,
          name: `Nhóm Thực hành ${idx + 1}`,
          members: [],
        }));
        sorted.forEach((stu, idx) => {
          const bIdx = idx % count;
          buckets[bIdx].members.push({
            ...stu,
            isLeader: buckets[bIdx].members.length === 0,
            score: calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester)),
          });
        });
        setGeneratedGroups(buckets);
      };

      const handleDownloadBackupJSON = () => {
        const payload = {
          schoolName, semester, teacherName, mainSubject, schoolYear, selectedWeek,
          archiveByYear, attendanceTypes, seatLayoutConfig, periodTimes,
          exportedAt: new Date().toISOString(),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SaoLuu_QuanLyLop_${teacherName.replace(/\s+/g, '_')}_Tuan${selectedWeek}.json`;
        a.click();
        showToast('Đã tải file Sao lưu (.JSON) về máy!');
      };

      const handleImportBackupJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && parsed.archiveByYear) {
              if (parsed.schoolName) setSchoolName(parsed.schoolName);
              if (parsed.semester) setSemester(parsed.semester);
              if (parsed.teacherName) setTeacherName(parsed.teacherName);
              if (parsed.mainSubject) setMainSubject(parsed.mainSubject);
              if (parsed.schoolYear) setSchoolYear(parsed.schoolYear);
              if (parsed.selectedWeek) setSelectedWeek(parsed.selectedWeek);
              setArchiveByYear(parsed.archiveByYear);
              if (parsed.attendanceTypes) setAttendanceTypes(parsed.attendanceTypes);
              if (parsed.seatLayoutConfig) setSeatLayoutConfig(parsed.seatLayoutConfig);
              if (parsed.periodTimes) setPeriodTimes(parsed.periodTimes);
              setBackupModalOpen(false);
              showToast('Đã khôi phục toàn bộ dữ liệu từ file .JSON!');
            }
          } catch (err) {
            showToast('File không đúng định dạng sao lưu.');
          }
        };
        reader.readAsText(file);
      };

      const handlePushToGitHubGist = async () => {
        if (!githubToken.trim()) {
          showToast('Vui lòng nhập GitHub Token trước.');
          return;
        }
        setCloudSyncLoading(true);
        try {
          const payload = {
            schoolName, semester, teacherName, mainSubject, schoolYear, selectedWeek,
            archiveByYear, attendanceTypes, seatLayoutConfig, updatedAt: Date.now(),
          };
          const url = githubGistId.trim()
            ? `https://api.github.com/gists/${githubGistId.trim()}`
            : 'https://api.github.com/gists';
          const res = await fetch(url, {
            method: githubGistId.trim() ? 'PATCH' : 'POST',
            headers: {
              Authorization: `token ${githubToken.trim()}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              description: `Sổ Quản Lý Lớp Học - GV ${teacherName}`,
              public: false,
              files: { 'gv_student_management_backup.json': { content: JSON.stringify(payload, null, 2) } },
            }),
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          if (data.id) {
            setGithubGistId(data.id);
            showToast(`Đã đồng bộ GitHub Cloud thành công! Mã Gist: ${data.id}`);
          }
        } catch (err) {
          showToast('Lỗi đồng bộ GitHub Gist.');
        } finally {
          setCloudSyncLoading(false);
        }
      };

      const handlePullFromGitHubGist = async () => {
        if (!githubToken.trim() || !githubGistId.trim()) return;
        setCloudSyncLoading(true);
        try {
          const res = await fetch(`https://api.github.com/gists/${githubGistId.trim()}`, {
            headers: { Authorization: `token ${githubToken.trim()}`, Accept: 'application/vnd.github+json' },
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          const raw = data.files?.['gv_student_management_backup.json']?.content;
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.archiveByYear) {
              setArchiveByYear(parsed.archiveByYear);
              if (parsed.schoolName) setSchoolName(parsed.schoolName);
              if (parsed.teacherName) setTeacherName(parsed.teacherName);
              if (parsed.selectedWeek) setSelectedWeek(parsed.selectedWeek);
              showToast('Đã tải dữ liệu từ GitHub Cloud thành công!');
            }
          }
        } catch (err) {
          showToast('Không thể tải dữ liệu từ GitHub Gist.');
        } finally {
          setCloudSyncLoading(false);
        }
      };

      const studentsToPrint = useMemo(() => {

          printReportTarget === 'ALL' ||
          printReportTarget === 'SEATING_CHART' ||
          printReportTarget === 'TIMETABLE_WEEKLY'
        ) {
          return rosterStudents;

        return [printReportTarget];

        setPrintReportType(type);

      const fundSummary = useMemo(() => {

              <Check className="w-4 h-4 text-emerald-300 shrink-0" />

                    </div>
                    <div className="space-y-2">
                      <div>Tôi tên là: ........................................................................ Là phụ huynh em: <strong>{stu.name}</strong> (Lớp {currentClassObj.name})</div>
                      <div>Sau khi nhận được Giấy mời của GVCN, gia đình xin phản hồi:</div>
                      <div>[ &nbsp; ] Sẽ có mặt đúng thời gian và địa điểm nêu trên.</div>
                      <div>[ &nbsp; ] Xin phép trao đổi qua điện thoại / hẹn lịch khác vì lý do: .......................................................................</div>
                      <div className="flex justify-end pt-2 text-center">
                        <div>
                          <div className="italic text-[11px]">Ngày ..... tháng ..... năm 202...</div>
                          <div className="font-bold text-[#183c42]">Phụ huynh ký xác nhận</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              ))}

            {printReportType === 'VIOLATION_COMMITMENT' &&
              studentsToPrint.map((stu, idx) => (
                <div key={stu.id} className={`p-6 max-w-4xl mx-auto text-xs ${idx < studentsToPrint.length - 1 ? 'page-break' : ''}`}>
                  <div className="bg-[#183c42] text-white p-4 rounded-xl text-center mb-4">
                    <div className="font-bold uppercase text-amber-200">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
                    <div className="text-[11px] italic text-[#e2dfd5]">Độc lập - Tự do - Hạnh phúc</div>
                    <div className="text-base font-bold uppercase mt-2">BẢN KIỂM ĐIỂM & CAM KẾT KHẮC PHỤC VI PHẠM NỀ NẾP</div>
                  </div>
                  <div className="space-y-2 leading-relaxed border border-[#183c42] bg-[#f6f5ef] p-4 rounded-xl">
                    <div>Kính gửi: Ban Giám hiệu <strong>{schoolName}</strong> và Giáo viên Chủ nhiệm lớp <strong>{currentClassObj.name}</strong>.</div>
                    <div>Em tên là: <strong className="text-[#183c42]">{stu.name}</strong> • Mã ĐD Bộ: <strong>{stu.moetId || stu.id}</strong> • Tổ: <strong>{stu.team}</strong> • SĐT HS: <strong>{stu.studentPhone || '--'}</strong>.</div>
                    <p>Trong Tuần {selectedWeek} ({semester} - Năm học {schoolYear}), em đã để xảy ra các thiếu sót về chuyên cần và nội quy lớp học.</p>
                    <p>Em xin nghiêm túc nhận khuyết điểm và cam kết với Thầy/Cô cùng Gia đình sẽ đi học đúng giờ, chuẩn bị bài đầy đủ và chấp hành nghiêm chỉnh nội quy nhà trường.</p>
                  </div>
                  <div className="grid grid-cols-3 text-center mt-8 text-[#183c42]">
                    <div>
                      <div className="font-bold">XÁC NHẬN CỦA PHỤ HUYNH</div>
                      <div className="mt-12 italic">(Ký và ghi rõ họ tên)</div>
                    </div>
                    <div>
                      <div className="font-bold">GIÁO VIÊN CHỦ NHIỆM</div>
                      <div className="mt-12 font-bold">{teacherName}</div>
                    </div>
                    <div>
                      <div className="font-bold">HỌC SINH CAM KẾT</div>
                      <div className="mt-12 font-bold">{stu.name}</div>
                    </div>
                  </div>
                </div>
              ))}

            {printReportType === 'COMMENDATION_CERT' &&
              studentsToPrint.map((stu, idx) => {
                const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);
                const yCond = calculateYearAttendanceSummary(stu.id);
                return (
                  <div key={stu.id} className={`p-8 max-w-4xl mx-auto text-center ${idx < studentsToPrint.length - 1 ? 'page-break' : ''}`}>
                    <div className="border-4 border-double border-[#183c42] bg-[#f6f5ef] rounded-2xl p-8 space-y-4">
                      <div className="inline-block px-4 py-1 rounded-full bg-[#183c42] text-amber-200 text-xs font-bold uppercase">
                        {schoolName} • LỚP {currentClassObj.name.toUpperCase()}
                      </div>
                      <div className="text-2xl font-bold uppercase tracking-wider text-[#183c42] mt-2">
                        GIẤY BIỂU DƯƠNG & KHEN THƯỞNG
                      </div>
                      <div className="text-xs italic text-[#8f5c38] font-semibold">Năm học {schoolYear} ({semester})</div>
                      <div className="pt-2 text-sm">Trân trọng biểu dương học sinh:</div>
                      <div className="text-2xl font-bold uppercase text-[#8f5c38]">{stu.name}</div>
                      <div className="text-xs text-[#183c42]">
                        Chức vụ: <strong>{stu.role}</strong> • ĐK Học nghề: <strong>{isStudentTakingVocational(stu) ? stu.vocational : 'Chỉ học Văn hóa'}</strong>
                      </div>
                      <p className="text-xs max-w-xl mx-auto leading-relaxed pt-2">
                        Đã có tinh thần học tập <strong className="text-[#526d5d]">{stu.attitude.toLowerCase()}</strong>, chấp hành tốt nội quy lớp học (Điểm rèn luyện: <strong className="text-[#183c42]">{yCond.avgConductScore}đ</strong>, ĐTB học tập: <strong className="text-[#8f5c38]">{gpa ?? '--'}</strong>), góp phần xây dựng tập thể {currentClassObj.name} vững mạnh.
                      </p>
                      <div className="flex justify-end pt-6 pr-8 text-xs">
                        <div>
                          <div className="italic">Ngày {liveDateText}</div>
                          <div className="font-bold uppercase mt-1 text-[#183c42]">GIÁO VIÊN CHỦ NHIỆM</div>
                          <div className="mt-12 font-bold text-sm text-[#183c42]">{teacherName}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}

            {printReportType === 'CLASS_MEETING_MINUTES' && (
              <div className="p-6 max-w-4xl mx-auto text-xs space-y-4">
                <div className="bg-[#183c42] text-white p-4 rounded-xl flex justify-between items-start">
                  <div>
                    <div className="font-bold uppercase text-amber-200">{schoolName}</div>
                    <div>Lớp: <strong>{currentClassObj.name}</strong> • Năm học: <strong>{schoolYear}</strong></div>
                  </div>
                  <div className="text-right">
                    <div className="font-bold uppercase">BIÊN BẢN SINH HOẠT LỚP TUẦN {selectedWeek} ({semester})</div>
                    <div className="text-[10px] text-[#e2dfd5] italic">
                      Từ Chủ nhật ({formatVNFullDate(currentWeekInfo?.startSunday)}) đến Thứ Bảy ({formatVNFullDate(currentWeekInfo?.endSaturday)})
                    </div>
                  </div>
                </div>

                <div className="border border-[#183c42] bg-[#f6f5ef] rounded-xl p-4 space-y-2 leading-relaxed">
                  <div><strong className="text-[#183c42]">I. Sĩ số & Tình hình chung:</strong> Tổng số học sinh Văn hóa: <strong>{currentStudents.length} HS</strong> (Trong đó học nghề: <strong>{currentStudents.filter((s) => isStudentTakingVocational(s)).length} HS</strong>) • GVCN: <strong>{teacherName}</strong>.</div>
                  <div><strong className="text-[#183c42]">II. Ưu điểm trong Tuần {selectedWeek}:</strong> {currentMeetingNote.achievements}</div>
                  <div><strong className="text-[#8f5c38]">III. Tồn tại & Nhắc nhở khắc phục:</strong> {currentMeetingNote.shortcomings}</div>
                  <div>
                    <strong className="text-[#183c42]">IV. Học sinh vi phạm cần lưu ý trong tuần:</strong>{' '}
                    {violationAnalytics.rankedStudents.length === 0
                      ? 'Cả lớp chấp hành tốt nội quy, không có học sinh vi phạm.'
                      : violationAnalytics.rankedStudents
                          .map((r) => `${r.student.name} (${r.violationCount} lỗi - còn ${r.conductScore}đ)`)
                          .join('; ')}
                  </div>
                  <div><strong className="text-[#526d5d]">V. Kế hoạch trọng tâm Tuần {Math.min(35, selectedWeek + 1)}:</strong></div>
                  <div className="whitespace-pre-line pl-3">{currentMeetingNote.nextWeekPlan}</div>
                </div>

                <div className="grid grid-cols-2 text-center pt-4 text-[#183c42]">
                  <div>
                    <div className="font-bold uppercase">LỚP TRƯỞNG / THƯ KÝ</div>
                    <div className="mt-12 font-bold">
                      {currentStudents.find((s) => s.role === 'Lớp trưởng')?.name || ''}
                    </div>
                  </div>
                  <div>
                    <div className="italic text-[11px] text-slate-600">Ngày {liveDateText}</div>
                    <div className="font-bold uppercase">GIÁO VIÊN CHỦ NHIỆM</div>
                    <div className="mt-12 font-bold">{teacherName}</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
